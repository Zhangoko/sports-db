<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Coach Work" />
  <meta name="theme-color" content="#0d1117" />
  <title>Coach Work</title>
  <style>
    /* ================= 设计系统（参考 NocoDB / Teable 等开源数据库界面） ================= */
    :root{
      --bg:#0d1117; --bg2:#121822; --bg3:#1a2231;
      --line:rgba(148,163,184,.13); --line2:rgba(148,163,184,.28);
      --t1:#e8edf4; --t2:#9aa7b8; --t3:#616e7d;
      --acc:#4f8ef7; --acc2:#8b5cf6; --ok:#3fb950; --warn:#d29922; --bad:#f85149;
      --overlay:rgba(4,7,12,.62);
      --r:10px;
      --shadow:0 8px 28px rgba(0,0,0,.4);
      color-scheme:dark;
    }
    html[data-theme="light"]{
      --bg:#f5f7fa; --bg2:#ffffff; --bg3:#e9edf3;
      --line:rgba(23,43,77,.12); --line2:rgba(23,43,77,.24);
      --t1:#1b2432; --t2:#57627a; --t3:#8b95a5;
      --overlay:rgba(15,23,42,.35);
      --shadow:0 8px 24px rgba(23,43,77,.12);
      color-scheme:light;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      background:var(--bg); color:var(--t1);
      font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
      font-size:13px; line-height:1.55; overflow:hidden;
    }
    ::-webkit-scrollbar{width:9px;height:9px}
    ::-webkit-scrollbar-thumb{background:rgba(148,163,184,.2);border-radius:5px}
    ::-webkit-scrollbar-thumb:hover{background:rgba(148,163,184,.35)}
    button{font-family:inherit}
    .mono{font-variant-numeric:tabular-nums}

    /* ---------- 应用框架：左导航 + 主区 ---------- */
    #app{display:grid;grid-template-columns:176px 1fr;height:100vh}
    .sidebar{
      background:var(--bg2); border-right:1px solid var(--line);
      display:flex; flex-direction:column; padding:14px 10px 12px; gap:2px; overflow-y:auto;
    }
    .logo{display:flex;align-items:center;gap:9px;padding:2px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
    .logoMark{width:30px;height:30px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(135deg,var(--acc),var(--acc2)); color:#fff; box-shadow:0 4px 14px rgba(79,142,247,.35)}
    .logoName{font-size:13.5px;font-weight:700;letter-spacing:.2px}
    .logoSub{font-size:10px;color:var(--t3);line-height:1.3}
    .nav{
      display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:9px;
      color:var(--t2);font-size:13px;cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:all .12s;
    }
    .nav:hover{background:rgba(148,163,184,.09);color:var(--t1)}
    .nav.on{background:linear-gradient(90deg,rgba(79,142,247,.18),rgba(139,92,246,.08));color:var(--acc)}
    .nav svg{flex:none}
    .nav .n{flex:1}
    .nav .cnt{font-size:10.5px;color:var(--t3);background:var(--bg3);border-radius:999px;padding:1px 7px;border:1px solid var(--line)}
    .sideFoot{margin-top:auto;padding-top:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
    .sideHint{font-size:10.5px;color:var(--t3);padding:6px 10px 2px;line-height:1.5}

    .main{display:flex;flex-direction:column;min-width:0;height:100vh}
    .topbar{
      display:flex;align-items:center;gap:12px;padding:10px 18px;
      border-bottom:1px solid var(--line);background:var(--bg2);flex:none;
    }
    .topTitle{font-size:15px;font-weight:700}
    .topSub{font-size:11px;color:var(--t3);margin-top:1px}
    .grow{flex:1}
    .searchWrap{position:relative;width:210px}
    .searchWrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--t3)}
    .search{width:100%;padding:7px 10px 7px 30px;border-radius:999px;border:1px solid var(--line);
      background:var(--bg3);color:var(--t1);font-size:12px;outline:none;transition:border .15s}
    .search:focus{border-color:var(--acc)}
    .search::placeholder{color:var(--t3)}

    #view{flex:1;overflow-y:auto;padding:16px 18px 30px}

    /* ---------- 通用组件 ---------- */
    .card{background:linear-gradient(180deg,var(--bg3),transparent 120%);border:1px solid var(--line);
      border-radius:12px;padding:14px 16px;margin-bottom:12px}
    .cardTitle{font-size:12px;color:var(--t3);font-weight:600;letter-spacing:.4px;margin-bottom:10px;
      display:flex;align-items:center;gap:7px}
    .cardTitle::before{content:'';width:3px;height:12px;border-radius:2px;background:linear-gradient(var(--acc),var(--acc2))}

    .btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;border:1px solid transparent;
      font-size:12.5px;font-weight:600;cursor:pointer;transition:all .15s;background:none;color:var(--t2)}
    .btn:hover{color:var(--t1)}
    .btnPrimary{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 4px 14px rgba(79,142,247,.28)}
    .btnPrimary:hover{filter:brightness(1.1);color:#fff}
    .btnGhost{border-color:var(--line);color:var(--t2);background:rgba(148,163,184,.04)}
    .btnGhost:hover{border-color:var(--line2);color:var(--t1);background:rgba(148,163,184,.09)}
    .btnDanger{border-color:rgba(248,81,73,.4);color:var(--bad)}
    .btnDanger:hover{background:rgba(248,81,73,.1)}
    .btnSm{padding:3px 10px;font-size:11.5px}

    .tag{display:inline-flex;align-items:center;gap:5px;padding:1.5px 9px;border-radius:999px;font-size:11px;font-weight:600;
      color:var(--c,#8b96a5);background:color-mix(in srgb,var(--c,#8b96a5) 13%,transparent);
      border:1px solid color-mix(in srgb,var(--c,#8b96a5) 28%,transparent);white-space:nowrap}
    .tag::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
    .tag.plain{--c:#8b96a5}
    .tag.ok{--c:var(--ok)} .tag.warn{--c:var(--warn)} .tag.bad{--c:var(--bad)} .tag.acc{--c:var(--acc)} .tag.purple{--c:#a371f7} .tag.orange{--c:#f59e0b} .tag.green{--c:#10b981} .tag.pink{--c:#f43f5e}

    .dot{width:6px;height:6px;border-radius:50%;display:inline-block;flex:none}
    .avatar{width:27px;height:27px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;
      font-size:11.5px;font-weight:700;color:#fff;background:var(--c,#8b96a5);box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}

    .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);
      font-size:12px;color:var(--t2);background:var(--bg3);cursor:pointer;transition:all .13s}
    .chip:hover{border-color:var(--line2);color:var(--t1)}
    .chip.on{background:linear-gradient(135deg,rgba(79,142,247,.22),rgba(139,92,246,.16));border-color:rgba(79,142,247,.5);color:var(--acc)}
    .chip .x{color:var(--t3);font-size:12px;line-height:1;background:none;border:none;cursor:pointer;padding:0}
    .chip .x:hover{color:var(--bad)}
    .chipRow{display:flex;flex-wrap:wrap;gap:6px}

    /* 统计卡 */
    .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px;margin-bottom:12px}
    .stat{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:12px;padding:13px 14px;
      background:linear-gradient(160deg,var(--bg3),transparent 130%);transition:transform .13s,border-color .13s}
    .stat:hover{transform:translateY(-2px);border-color:var(--line2)}
    .stat .ico{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:9px;
      color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
    .stat .lbl{font-size:11px;color:var(--t3)}
    .stat .val{font-size:22px;font-weight:750;letter-spacing:.2px;font-variant-numeric:tabular-nums}
    .stat .delta{font-size:10.5px;color:var(--t3);margin-top:1px}

    /* 表格 */
    .tableWrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--bg2)}
    table.tbl{width:100%;border-collapse:collapse;min-width:760px}
    .tbl th{font-size:10.5px;color:var(--t3);font-weight:600;text-align:left;padding:9px 12px;
      border-bottom:1px solid var(--line);letter-spacing:.4px;white-space:nowrap;background:rgba(148,163,184,.04)}
    .tbl td{padding:9px 12px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--t1);white-space:nowrap;vertical-align:middle}
    .tbl tbody tr:last-child td{border-bottom:none}
    .tbl tbody tr{transition:background .12s}
    .tbl tbody tr:hover{background:rgba(79,142,247,.055)}
    .tbl .sub{font-size:11px;color:var(--t3)}
    .rowActs{display:inline-flex;gap:4px;opacity:0;transition:opacity .13s}
    tr:hover .rowActs{opacity:1}
    .iconBtn{width:25px;height:25px;border-radius:7px;border:none;background:none;color:var(--t3);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
    .iconBtn:hover{background:rgba(148,163,184,.13);color:var(--t1)}
    .iconBtn.danger:hover{background:rgba(248,81,73,.13);color:var(--bad)}

    /* 表单 */
    .formGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:11px}
    .field label{display:block;font-size:11px;color:var(--t3);margin-bottom:5px;font-weight:600}
    .wellDef{display:block;font-size:10px;color:var(--t3);line-height:1.45;margin:4px 0 0;opacity:.85}
    .wellGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:10px}
    .wellBlock{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg2)}
    .wellBlockTitle{font-size:11.5px;font-weight:700;color:var(--t1);margin-bottom:10px;display:flex;align-items:center;gap:6px}
    .wellRangeRow{display:flex;align-items:center;gap:10px}
    .wellRange{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:var(--line2);outline:none;cursor:pointer}
    .wellRange::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.3)}
    .wellRangeVal{flex:none;width:30px;text-align:center;font-weight:700;font-size:16px;color:var(--acc);font-variant-numeric:tabular-nums}
    .field .req{color:var(--bad)}
    .inp,textarea.inp{width:100%;padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:var(--bg3);
      color:var(--t1);font-size:12.5px;outline:none;transition:border .15s,box-shadow .15s;font-family:inherit}
    .inp:focus,textarea.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(79,142,247,.15)}
    textarea.inp{resize:vertical;min-height:52px}

    /* 力量条 */
    .sbar{display:flex;align-items:center;gap:10px;margin-top:7px}
    .sbar .lbl{width:56px;flex:none;font-size:11px;color:var(--t3)}
    .sbar .track{flex:1;height:6px;border-radius:3px;background:rgba(148,163,184,.1);overflow:hidden}
    .sbar .fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s}
    .sbar .v{width:56px;flex:none;text-align:right;font-size:11.5px;color:var(--t2);font-variant-numeric:tabular-nums}

    /* 进度 */
    .prog{height:7px;border-radius:4px;background:rgba(148,163,184,.1);overflow:hidden}
    .prog>div{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s}
    .prog.ok>div{background:linear-gradient(90deg,#2ea043,var(--ok))}

    /* 计划表 */
    .planTable{min-width:940px}
    .planTable .weekLbl{font-weight:700;color:var(--t2);white-space:nowrap}
    .cell{position:relative;display:block;width:100%;min-width:118px;padding:7px 8px;text-align:left;border-radius:9px;
      border:1px solid var(--line);background:var(--bg3);color:var(--t1);font-size:11.5px;line-height:1.5;
      cursor:pointer;transition:all .13s;font-family:inherit;white-space:normal}
    .cell:hover{border-color:var(--acc);transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.3)}
    .cell.done{background:color-mix(in srgb,var(--ok) 9%,transparent);border-color:color-mix(in srgb,var(--ok) 30%,transparent);
      color:var(--t2);text-decoration:line-through;text-decoration-color:rgba(63,185,80,.55)}
    .cell .ph{color:var(--t3)}
    .cell .doneMark{position:absolute;top:4px;right:6px;font-size:10px;color:var(--ok)}
    .phaseInp{width:88px;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--bg3);color:var(--t1);
      font-size:12px;outline:none;font-family:inherit}
    .phaseInp:focus{border-color:var(--acc)}

    /* 列表 */
    .kvRow{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:12.5px;border-bottom:1px dashed var(--line)}
    .kvRow:last-child{border-bottom:none}
    .kvRow .k{color:var(--t3)} .kvRow .v{color:var(--t1);text-align:right}

    /* 浮层 */
    .overlay{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(4px);
      display:flex;align-items:center;justify-content:center;z-index:100}
    .modal{width:min(540px,94vw);max-height:84vh;overflow:auto;border-radius:14px;border:1px solid var(--line2);
      background:var(--bg2);box-shadow:var(--shadow);padding:18px 20px;animation:pop .16s ease}
    @keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
    .modalTitle{font-size:14px;font-weight:700;margin-bottom:2px}
    .modalSub{font-size:11.5px;color:var(--t3);margin-bottom:12px}

    .empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:36px 0;color:var(--t3);font-size:12.5px}
    .empty svg{opacity:.5}

    .hint{font-size:11px;color:var(--t3);line-height:1.6}
    .mt8{margin-top:8px}.mt12{margin-top:12px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}
    .row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
    .hide{display:none!important}

    /* 概览页可拖拽卡片 */
    #ovList{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
    .ovCard{position:relative;margin:0}
    .ovCard[data-act]{cursor:pointer}
    .ovCard.stat{flex:1 1 158px}
    .ovCard.card{flex:1 1 100%;margin-bottom:0}
    .ovCard .dragHint{position:absolute;top:6px;right:8px;color:var(--t3);opacity:0;transition:opacity .13s;cursor:grab;z-index:3}
    .ovCard:hover .dragHint{opacity:.9}
    .ovCard.drag{opacity:.4;border-style:dashed}
    .ovDrop{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--acc),var(--acc2));flex:1 1 100%;margin:0;pointer-events:none}

    @media (max-width:820px){
      #app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
      .sidebar{flex-direction:row;border-right:none;border-bottom:1px solid var(--line);overflow-x:auto;align-items:center;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}
      .logo{border-bottom:none;margin-bottom:0;padding:0 6px}
      .nav .n{display:none}.nav{width:auto;justify-content:center;padding:9px 13px}
      .nav .cnt{display:none}
      .sideFoot{flex-direction:row;margin-top:0;border-top:none;padding-top:0;flex-wrap:nowrap}
      .sideHint{display:none}
      .searchWrap{width:auto;flex:1}
      .topSub{display:none}
      .iconBtn{width:30px;height:30px}
      .btn{padding:7px 14px}
      .stats{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
      .cell{min-width:104px}
      .formGrid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
    }
    @media (max-width:560px){
      #saveTag{display:none}
      .topTitle{font-size:14px}
      .topbar{padding:9px 12px;gap:8px}
      #view{padding:12px 12px 30px}
      .modal{padding:14px}
    }
  </style>
</head>
<body>
  <div id="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <header class="topbar">
        <div>
          <div class="topTitle">Coach Work</div>
          <div class="topSub">CSCS 田径周期化 · 档案 / 力量 / 训练内容 / 月计划 / 周期计划</div>
        </div>
        <span class="grow"></span>
        <span class="tag acc" id="saveTag">已保存到本地</span>
        <button class="btn btnGhost btnSm" id="themeBtn" data-act="themeToggle" title="切换浅色 / 深色模式">🌙 深色</button>
        <button class="btn btnPrimary btnSm hide" id="updateBtn" data-act="doUpdate" title="点击更新到最新版">🔄 发现新版本，点击更新</button>
        <div class="searchWrap">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input class="search" id="gsearch" placeholder="搜索运动员姓名 / 项目…" />
        </div>
      </header>
      <div id="view"></div>
    </main>
  </div>
  <div id="overlay" class="overlay hide"></div>

  <script>
  (function () {
    'use strict';
    /* ================= 常量 / 状态 ================= */
    var LS_KEY = 'sportsdb_v1';
    /* 版本与更新：改内容后同时递增 APP_VERSION 并更新 version.json 里的 version 即可推送更新 */
    var APP_VERSION = '1.0.3';
    var UPDATE_JSON = 'https://cdn.jsdelivr.net/gh/Zhangoko/sports-db@latest/version.json';
    var DAYS = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
    var DEF_ITEMS = ['30米', '60米', '100米', '110米', '150米', '200米', '300米'];
    var CYCLE_MODELS = {
      macro: { label: '大周期 12周', weeks: 12 },
      meso:  { label: '中周期 8周',  weeks: 8 },
      pre:   { label: '赛前周期 4周', weeks: 4 },
      trans: { label: '过渡期 2周',  weeks: 2 }
    };
    var PHASE_NAMES = { GP: '一般准备期', SP: '专项准备期', PRE: '赛前期', COMP: '比赛期', TR: '过渡期' };
    var MONTH_PHASES = [
      { key: 'GP',   label: '一般准备期' },
      { key: 'SP',   label: '专项准备期' },
      { key: 'PRE',  label: '赛前期' },
      { key: 'COMP', label: '比赛期' },
      { key: 'TR',   label: '过渡期' }
    ];
    function phaseSeq(N) {
      var cuts = [0.3, 0.6, 0.85, 1.0], keys = ['GP', 'SP', 'PRE', 'COMP'];
      var seq = [], prev = 0;
      for (var i = 0; i < 4; i++) {
        var end = Math.min(N, Math.max(prev + 1, Math.round(N * cuts[i])));
        if (end > prev) seq.push([prev, end, keys[i]]);
        prev = end;
      }
      return seq;
    }
    function seqFor(modelKey) {
      if (modelKey === 'trans') return [[0, 2, 'TR']];
      if (modelKey === 'pre') return [[0, 1, 'SP'], [1, 3, 'PRE'], [3, 4, 'COMP']];
      if (modelKey === 'meso') return phaseSeq(8);
      return phaseSeq(12);
    }
    function disciplineOf(a) {
      var ev = ((a && a.event) || '').toLowerCase();
      if (/(栏|hurdle)/.test(ev)) return 'hurdle';
      if (/(长跑|800|1500|3000|5000|10000|马拉松|marathon)/.test(ev)) return 'distance';
      return 'sprint';
    }
    function colorOf(ev) {
      var e = (ev || '').toLowerCase();
      if (/(栏|hurdle)/.test(e)) return '#a371f7';
      if (/(长跑|800|1500|3000|5000|10000|马拉松)/.test(e)) return '#f59e0b';
      if (/(跳|jump)/.test(e)) return '#10b981';
      if (/(投|throw)/.test(e)) return '#f43f5e';
      if (/(短跑|100|200|400|短)/.test(e)) return '#4f8ef7';
      return '#8b96a5';
    }

    function defaults() {
      return { athletes: [], items: DEF_ITEMS.slice(), month: {}, cycle: {}, results: {}, cycleStart: {}, ui: {}, wellness: {} };
    }
    var DB, storageOk = true;
    try {
      var raw = localStorage.getItem(LS_KEY);
      DB = raw ? Object.assign(defaults(), JSON.parse(raw)) : defaults();
    } catch (e) { storageOk = false; DB = defaults(); }
    function save() {
      try { localStorage.setItem(LS_KEY, JSON.stringify(DB)); storageOk = true; }
      catch (e) { storageOk = false; }
      var t = document.getElementById('saveTag');
      if (t) {
        t.textContent = storageOk ? '已保存到本地' : '无法保存，请导出备份';

          2: ['间歇：600米×2（90%）', '轻松跑15分钟', '间歇：600米×2', '轻松跑15分钟'],
          3: ['恢复跑15分钟', '拉伸', '恢复跑15分钟', '拉伸'],
          4: ['间歇：400米×4（95%）', '轻松跑20分钟', '间歇：400米×4', '赛前检查'],

    /* 取某阶段 4 周模板（按项目覆盖；mode=level3 用田径专项模板） */
    function phaseWeeks(phase, disc, mode) {
      var weeks = (mode === 'level3' ? TPL_L3[phase] : TPL[phase]) || TPL[phase];
      var ov = (TPL_DISC[disc] && TPL_DISC[disc][phase]) || null;
      if (!ov) return weeks;
      var out = [];
      for (var k = 0; k < 4; k++) {
        var wk = weeks[k].slice();
        for (var d in ov) {
          if (!ov.hasOwnProperty(d)) continue;
          var dd = ov[d];
          wk[+d] = Array.isArray(dd) ? (dd[k] != null ? dd[k] : dd[0]) : dd;
        }
        out.push(wk);
      }
      return out;
    }
    function genMonth(phaseKey) {
      var plan = ensurePlan('month', S.sel);
      var weeks = phaseWeeks(phaseKey, disciplineOf(getAthlete(S.sel)), S.planMode);
      for (var w = 0; w < 4; w++) {
        plan.rows[w] = weeks[w].map(function (t) { return { t: t, done: false }; });
      }
      save();
    }
    function genCycle(modelKey) {
      var plan = ensurePlan('cycle', S.sel);
      var N = CYCLE_MODELS[modelKey].weeks;
      var seq = seqFor(modelKey);
      var disc = disciplineOf(getAthlete(S.sel));
      plan.weeks = N;
      plan.phases = [];
      plan.rows = [];
      for (var w = 0; w < N; w++) {
        var key = 'TR';
        for (var s = 0; s < seq.length; s++) {
          if (w >= seq[s][0] && w < seq[s][1]) { key = seq[s][2]; break; }
        }
        plan.phases.push(PHASE_NAMES[key]);
        var wk = phaseWeeks(key, disc, S.planMode)[w % 4];
        plan.rows.push(wk.map(function (t) { return { t: t, done: false }; }));
      }
      DB.cycleStart[S.sel] = todayStr();
      save();
    }

    /* ================= 测试数据生成（50 名运动员，用于体验/演示） ================= */
    function genTestData() {
      var has = DB.athletes.length;
      autoBackup('Coach Work-生成测试数据前');
      if (!confirm(has ? ('当前已有 ' + has + ' 名运动员。\n将追加生成 50 名测试运动员（约千条成绩 + 月/周期计划），不覆盖现有数据。\n确定继续？') : '将生成 50 名测试运动员（约千条成绩 + 月/周期计划），用于体验各页功能。\n确定继续？')) return;
      var SURNAMES = ['张', '王', '李', '赵', '刘', '陈', '杨', '黄', '周', '吴', '徐', '孙', '马', '朱', '胡', '郭', '何', '高', '林', '罗', '郑', '梁', '谢', '宋', '唐', '许', '韩', '冯', '邓', '曹', '彭', '曾', '肖', '田', '董', '袁', '潘', '蒋', '蔡', '余', '杜', '叶', '程', '苏', '魏', '吕', '丁', '任', '沈', '姚'];
      var GIVEN1 = ['伟', '芳', '娜', '敏', '静', '磊', '军', '洋', '勇', '艳', '杰', '涛', '明', '超', '秀', '霞', '平', '刚', '桂', '英', '华', '强', '鹏', '辉', '俊', '浩', '凯', '鑫', '雷', '峰', '翔', '宇', '泽', '睿', '晨', '阳', '博', '文', '健', '帅'];
      var GIVEN2 = ['子', '雨', '嘉', '一', '可', '佳', '梦', '思', '天', '海', '玉', '金', '雪', '月', '星', '龙', '虎', '山', '川', '光', '云', '风', '飞', '航', '达', '威', '岩'];
      var EVENTS = ['短跑', '110米栏', '短跑', '中长跑', '跳远', '铅球', '短跑', '三级跳远', '800米', '跨栏'];
      var ITEMS_BY_EVENT = {
        '短跑': ['100米', '60米', '30米', '200米'],
        '110米栏': ['110米', '60米', '30米'],
        '跨栏': ['110米', '60米', '30米'],
        '中长跑': ['300米', '100米', '60米'],
        '800米': ['300米', '100米', '60米'],
        '跳远': ['30米', '60米', '100米'],
        '三级跳远': ['30米', '60米', '100米'],
        '铅球': ['30米', '60米']
      };
      var SPEED = { '30米': [3.85, 4.75], '60米': [7.05, 8.55], '100米': [11.35, 13.85], '110米': [14.9, 18.9], '150米': [17.0, 21.3], '200米': [22.6, 27.5], '300米': [38.2, 48.4] };
      var STR = { '深蹲': [60, 150], '半蹲': [80, 190], '高翻': [40, 100], '卧推': [40, 115] };
      var STR_NAMES = ['深蹲', '半蹲', '高翻', '卧推'];
      var STR_FIELD = { '深蹲': 'squat', '半蹲': 'halfSquat', '高翻': 'clean', '卧推': 'bench' };
      var PLAN_POOL = ['30米×6组 90%', '60米×4 加速跑', '100米×3 计时跑', '深蹲 5×5', '半蹲 5×5', '高翻 5×3', '卧推 4×6', '起跑技术×8', '小步跑/高抬腿×4', '核心训练20分钟', '慢跑恢复30分钟', '跳箱×5 弹性训练', '间歇跑 200米×6', '拉伸放松15分钟', '休息'];
      var usedNames = {};
      for (var ui = 0; ui < DB.athletes.length; ui++) usedNames[DB.athletes[ui].name] = 1;
      function rnd(a, b) { return a + Math.random() * (b - a); }
      function rndi(a, b) { return Math.floor(rnd(a, b + 1)); }
      function pick(arr) { return arr[rndi(0, arr.length - 1)]; }
      function mkName() {
        for (var t = 0; t < 200; t++) {
          var n = pick(SURNAMES) + pick(GIVEN1) + (Math.random() < 0.45 ? pick(GIVEN2) : '');
          if (!usedNames[n]) { usedNames[n] = 1; return n; }
        }
        return pick(SURNAMES) + GIVEN1[rndi(0, GIVEN1.length - 1)] + rndi(10, 99);
      }
      function dayAgo(d) {
        var dt = new Date();
        dt.setDate(dt.getDate() - d);
        var p = function (x) { return String(x).padStart(2, '0'); };
        return dt.getFullYear() + '-' + p(dt.getMonth() + 1) + '-' + p(dt.getDate());
      }
      function mkRec(item, date, val, wind) {
        var r = { id: uid(), item: item, date: date, time: Math.round(val * 100) / 100, note: '', wind: '', timing: '' };
        if (wind !== undefined) r.wind = wind;
        if (!isStrengthItem(item) && Math.random() < 0.25) r.timing = Math.random() < 0.5 ? '手计' : '电计';
        return r;
      }
      var recTotal = 0;
      for (var i = 0; i < 50; i++) {
        var ev = EVENTS[i % EVENTS.length];
        var evItems = ITEMS_BY_EVENT[ev];
        var main = evItems[0];
        var others = evItems.slice(1, 3);
        var strPick = [pick(STR_NAMES)];
        if (Math.random() < 0.6) { var s2 = pick(STR_NAMES); if (strPick.indexOf(s2) < 0) strPick.push(s2); }
        var ath = {
          id: uid(),
          name: mkName(),
          height: String(rndi(165, 193)),
          weight: String(rndi(52, 88)),
          event: ev,
          testDay: DAYS[rndi(0, 6)],
          strength: {},
          note: i % 9 === 0 ? '测试数据' : '',
          items: [main].concat(others).concat(strPick)
        };
        for (var sk = 0; sk < STR_NAMES.length; sk++) {
          var it0 = STR_NAMES[sk];
          ath.strength[STR_FIELD[it0]] = String(Math.round(rnd(STR[it0][0], STR[it0][1])));
        }
        /* —— 成绩记录：主测项 7 条（约 63 天，逐步进步），力量 5 条，副项 3 条 —— */
        var recs = [];
        var dStart = 63;
        for (var k = 0; k < 7; k++) {
          var v = rnd(SPEED[main][0], SPEED[main][1]) * (1 - k * 0.005 + rnd(-0.008, 0.008));
          var wind = '';
          if (i % 17 === 0 && k === 1) wind = '+2.8';
          else if (Math.random() < 0.12) wind = (Math.random() < 0.5 ? '+' : '-') + (0.3 + Math.random() * 1.5).toFixed(1);
          recs.push(mkRec(main, dayAgo(dStart - k * 10), v, wind === '' ? undefined : wind));
        }
        for (var si = 0; si < strPick.length; si++) {
          var si0 = rnd(STR[strPick[si]][0], STR[strPick[si]][1]);
          for (var k2 = 0; k2 < 5; k2++) {
            recs.push(mkRec(strPick[si], dayAgo(dStart - k2 * 9), si0 * (1 + k2 * 0.007 + rnd(-0.01, 0.01))));
          }
        }
        for (var oi = 0; oi < others.length; oi++) {
          var ob = rnd(SPEED[others[oi]][0], SPEED[others[oi]][1]);
          for (var k3 = 0; k3 < 3; k3++) {
            recs.push(mkRec(others[oi], dayAgo(dStart - 30 - k3 * 9), ob * (1 - k3 * 0.004 + rnd(-0.01, 0.01))));
          }
        }
        /* 特殊样例：平台期 / 疑似疲劳 / 少量数据（便于观察分析提示） */
        if (i === 47) {
          recs = recs.filter(function (x) { return x.item !== main; });
          var good = rnd(SPEED[main][0], SPEED[main][1]) * 0.97;
          recs.push(mkRec(main, dayAgo(70), good));
          var pv = good * 1.02;
          for (var p2 = 0; p2 < 5; p2++) recs.push(mkRec(main, dayAgo(40 - p2 * 4), pv * (1 + rnd(-0.004, 0.004))));
        } else if (i === 48) {
          recs.push(mkRec(main, dayAgo(1), rnd(SPEED[main][0], SPEED[main][1]) * 1.12));
        } else if (i === 49) {
          recs = recs.slice(0, 2);
        }
        recs.sort(function (x, y) { return x.date < y.date ? -1 : (x.date > y.date ? 1 : 0); });
        DB.results[ath.id] = recs;
        recTotal += recs.length;
        /* —— 月计划（4 周，含完成度） —— */
        var mp = ensurePlan('month', ath.id);
        for (var w = 0; w < 4; w++) {
          for (var dd = 0; dd < 7; dd++) {
            var c = mp.rows[w][dd];
            c.t = Math.random() < 0.85 ? pick(PLAN_POOL) : '';
            c.done = c.t ? Math.random() < 0.75 : false;
          }
        }
        /* —— 周期计划（8 周 meso，含阶段与完成度） —— */
        var cp = ensurePlan('cycle', ath.id);
        var N = 8, seq = seqFor('meso');
        cp.weeks = N; cp.phases = []; cp.rows = [];
        for (var w2 = 0; w2 < N; w2++) {
          var key = 'TR';
          for (var s2b = 0; s2b < seq.length; s2b++) if (w2 >= seq[s2b][0] && w2 < seq[s2b][1]) { key = seq[s2b][2]; break; }
          cp.phases.push(PHASE_NAMES[key]);
          var wk = phaseWeeks(key, disciplineOf(ath), S.planMode)[w2 % 4];
          cp.rows.push(wk.map(function (t) { return { t: t, done: Math.random() < 0.7 }; }));
        }
        DB.cycleStart[ath.id] = dayAgo(55);
        DB.athletes.push(ath);
      }
      save(); renderSidebar(); renderView();
      alert('✅ 已生成 50 名测试运动员：共 ' + recTotal + ' 条成绩记录，每人含月计划与 8 周周期计划。\n'
        + '可到「成绩」「成绩对比」「周期计划」页查看演示效果（含平台期、疑似疲劳、超风速样例）。\n'
        + '想清空请用侧边栏「清空数据」。');
    }

    /* ================= 渲染：各页 ================= */
    function planStats(store) {
      var total = 0, done = 0;
      for (var id in store) {
        var p = store[id];
        for (var w = 0; w < p.rows.length; w++) for (var d = 0; d < p.rows[w].length; d++) {
          total++;
          if (p.rows[w][d] && p.rows[w][d].done) done++;
        }
      }
      return { total: total, done: done, pct: total ? Math.round(done / total * 100) : 0 };
    }

    function bindOverviewDnD() {
      var list = document.getElementById('ovList');
      if (!list) return;
      var src = null;
      function clearDrop() { var i = list.querySelector('.ovDrop'); if (i) i.remove(); }
      function clearDrag() { var d = list.querySelector('.ovCard.drag'); if (d) d.classList.remove('drag'); }
      list.addEventListener('dragstart', function (e) {
        var c = e.target.closest('.ovCard');
        if (!c) return;
        src = c;
        c.classList.add('drag');
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', c.getAttribute('data-key')); } catch (err) {}
      });
      list.addEventListener('dragover', function (e) {
        if (!src) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        clearDrop();
        var t = e.target.closest('.ovCard');
        if (!t || t === src) return;
        var r = t.getBoundingClientRect();
        var before = e.clientY < r.top + r.height / 2;
        var ind = document.createElement('div');
        ind.className = 'ovDrop';
        if (before) t.parentNode.insertBefore(ind, t);
        else t.parentNode.insertBefore(ind, t.nextSibling);
      });
      list.addEventListener('drop', function (e) {
        e.preventDefault();
        if (!src) return;
        var ind = list.querySelector('.ovDrop');
        if (ind) { list.insertBefore(src, ind); ind.remove(); }
        else clearDrop();
        clearDrag();
        src = null;
        saveOvOrder();
      });
      list.addEventListener('dragend', function () {
        clearDrop();
        clearDrag();
        src = null;
        saveOvOrder();
      });
    }

      var baseItems = (a.items && a.items.length) ? a.items : DB.items;
      var items = [];
      for (var bi = 0; bi < STRENGTH_ITEMS.length; bi++) if (items.indexOf(STRENGTH_ITEMS[bi]) < 0) items.push(STRENGTH_ITEMS[bi]);
      for (var bi2 = 0; bi2 < baseItems.length; bi2++) if (items.indexOf(baseItems[bi2]) < 0) items.push(baseItems[bi2]);

        var unit = maxMode ? 'kg' : 's';
        var cleanList = cleanRecs(list);
        var hist = bestOf(cleanList, maxMode);
        var cyc = cycleStart ? bestOf(cleanRecs(list.filter(function (x) { return x.date >= cycleStart; })), maxMode) : null;
        var arr = list.slice(0, 5);
        var trendTag = '';
        if (arr.length >= 2) {
          var f0 = num(arr[0].time), l0 = num(arr[arr.length - 1].time);
          var diff = f0 - l0;

        }
        var recentTag = '<span class="tag plain" title="最近 ' + arr.length + ' 次成绩（左→右 新→旧）">近期 ' + arr.map(function (x) { return num(x.time).toFixed(2); }).join(' → ') + '</span>';
        var tr = trendInfo(list, maxMode);
        var rateTag = '';
        if (tr) {
          var rv = tr.rate;
          if (Math.abs(rv) < 0.005) rateTag = '<span class="tag plain">改善 ≈ 0' + unit + '/周</span>';
          else if (rv > 0) rateTag = '<span class="tag ok">近期改善 ' + Math.abs(rv).toFixed(2) + unit + '/周 ↑</span>';

        var anom = anomalySet(list, maxMode);
        var rows = '';
        for (var n = 0; n < list.length; n++) {
          var rc2 = list[n];
          var t = num(rc2.time);
          var isHist = hist !== null && t > 0 && Math.abs(t - hist) < 1e-9;
          var isCyc = !isHist && cyc !== null && t > 0 && Math.abs(t - cyc) < 1e-9;
          var env = envLabel(rc2);

          rows += '<tr>' +

            '<td class="sub">' + (rc2.note ? esc(rc2.note) : '—') + '</td>' +

            '<button class="iconBtn danger" data-act="recDel" data-id="' + esc(rc2.id) + '" title="删除">' + ico('trash') + '</button>' +
            '</span></td>' +
            '</tr>';
        }
        cards += '<div class="card"><div class="row mb8" style="justify-content:space-between">' +
          '<span class="cardTitle" style="margin:0">' + esc(it) + '</span>' +
          '<span class="row" style="gap:6px">' +
            '<button class="btn btnGhost btnSm" data-act="recQuick" data-item="' + esc(it) + '" title="填写 ' + esc(it) + ' 的' + unit + '成绩">' + ico('plus') + '记一笔</button>' +
            '<span class="tag ok">历史最佳 ' + (hist !== null ? hist.toFixed(2) + unit : '—') + '</span>' +
            '<span class="tag acc">' + (cycleStart ? '周期最佳 ' + (cyc !== null ? cyc.toFixed(2) + unit : '—') : '未设周期') + '</span>' +
            '<span class="tag plain">' + list.length + ' 次</span>' +
            recentTag + trendTag + rateTag + platTag +
          '</span></div>' +
          '<div class="tableWrap"><table class="tbl" style="min-width:460px">' +
            '<thead><tr><th>日期</th><th>成绩</th><th>备注</th><th>标记</th><th></th></tr></thead>' +
            '<tbody>' + rows + '</tbody></table></div></div>';
      }
      if (!cards) {
        if (!recs.length) {
          cards = '<div class="card"><div class="empty">' + ico('trophy') + '<span>还没有成绩记录，用上方表单记录第一条</span></div></div>';
        } else {
          cards = '<div class="card"><div class="empty">' + ico('trophy') + '<span>「' + esc(S.recFilter) + '」还没有成绩记录，点该条目的「记一笔」或在上方表单填写</span></div></div>';
        }
      }

      var filterChips = '<button class="chip' + (S.recFilter === 'all' ? ' on' : '') + '" data-act="recFilter" data-item="all">全部</button>';
      for (var f = 0; f < itemOrder.length; f++) {
        var fo = itemOrder[f];
        filterChips += '<button class="chip' + (S.recFilter === fo ? ' on' : '') + '" data-act="recFilter" data-item="' + esc(fo) + '">' + esc(fo) + '</button>';
      }

      var TARGETS = ['30米', '60米', '100米'];
      var avgHtml = '';
      for (var t = 0; t < TARGETS.length; t++) {
        var ta = teamAvg(TARGETS[t]);
        avgHtml += '<div class="stat" style="--c:#4f8ef7"><div class="ico">' + ico('run') + '</div>' +

          '<div class="delta">' + (ta ? '按 ' + ta.n + ' 名运动员历史最佳' : '暂无记录') + '</div></div>';
      }

      var testHint = '';
      if (a.testDay && weekdayCN() === a.testDay) {
        testHint = '<div class="card" style="border-color:rgba(210,153,34,.45)"><div class="row">' +
          '<span class="tag warn">📅 今天是固定测试日（每周' + esc(a.testDay) + '）</span>' +
          '<span class="hint">记得完成周期性测试并记录成绩</span></div></div>';
      }
      var phaseCard = renderPhaseCompare(a);

      v.innerHTML =
        '<div class="card"><div class="cardTitle">运动员 · ' + esc(a.name) + '</div><div class="row">' + athleteChips() + '</div></div>' +
        testHint +
        '<div class="card"><div class="cardTitle">全队平均成绩（30 / 60 / 100米）</div>' +
          '<div class="stats" style="margin-bottom:0">' + avgHtml + '</div>' +
          '<div class="hint mt8">每名运动员取该距离的历史最佳成绩，再对全队求平均。</div>' +
        '</div>' +
        '<div class="card" style="border-color:rgba(63,185,80,.3)"><div class="row"><span class="cardTitle" style="margin:0">记录训练成绩</span><span class="grow"></span><button class="btn btnGhost btnSm" data-act="exportExcel">' + ico('export') + '导出 Excel</button></div>' +
          '<div class="chipRow mb8">' + itemChips + '</div>' +
          '<div class="field mb8"><label>自行输入训练内容（选填；填了优先于上方选择，不在列表也能记）</label><input class="inp" id="recCustom" value="' + esc(S.recCustom || '') + '" placeholder="如：400米 / 立定跳远 / 技术训练" /></div>' +
          '<div class="hint mb8">将记入：<span class="tag acc">' + esc(S.recItem) + '</span>（' + (isStrengthItem(S.recItem) ? '力量成绩 · 单位 kg · 越大越好' : '训练内容成绩 · 单位 秒 · 越小越好') + '；如填了上方自定义内容则记入该内容）</div>' +
          '<div class="row" style="align-items:flex-end">' +
            '<div class="field" style="min-width:140px"><label>日期</label><input class="inp" type="date" id="recDate" value="' + esc(S.recDate || todayStr()) + '" /></div>' +
            '<div class="field" style="min-width:130px"><label>成绩（' + (isStrengthItem(S.recItem) ? 'kg' : '秒') + '）</label><input class="inp" id="recTime" type="number" step="0.01" min="0" placeholder="' + (isStrengthItem(S.recItem) ? '如 100（可备注 5×5）' : '如 12.35') + '" /></div>' +
            (isStrengthItem(S.recItem) ? '' : '<div class="field" style="min-width:96px"><label>风速 m/s</label><input class="inp" id="recWind" type="number" step="0.1" placeholder="如 +1.2 / -0.5" /></div>' +
            '<div class="field" style="min-width:96px"><label>计时</label><select class="inp" id="recTiming"><option value="">—</option><option value="手计">手计</option><option value="电计">电计</option></select></div>') +
            '<div class="field grow" style="flex:1;min-width:150px"><label>备注（选填）</label><input class="inp" id="recNote" placeholder="如：起跑反应 / 逆风 / 测试" /></div>' +
            '<button class="btn btnPrimary" data-act="recSave">' + ico('check') + '保存记录</button>' +
          '</div>' +
          '<div class="hint mt8">💡 输入成绩后按 <b>回车</b> 直接保存并自动聚焦下一个输入框，可连续录入（日期自动沿用）；破纪录时才会弹窗提示。</div>' +
        '</div>' +
        '<div class="card"><div class="cardTitle">当前周期</div>' +
          '<div class="row">' +
            '<span class="hint">周期起始日期（一键生成周期计划时自动设为当天；「周期最佳」按此日期起算）：</span>' +
            '<input class="inp" type="date" id="cycleStartInp" value="' + esc(cycleStart || todayStr()) + '" style="width:150px;padding:6px 9px" />' +
            '<button class="btn btnGhost btnSm" data-act="recSetStart">' + ico('cal') + '设置起始日</button>' +
            '<span class="tag ' + (cycleStart ? 'acc' : 'warn') + '">' + (cycleStart ? '本周期自 ' + esc(cycleStart) + ' 起' : '未设置：周期最佳 = 历史最佳') + '</span>' +
          '</div>' +
        '</div>' +
        phaseCard +
        '<div class="row mb12" style="align-items:center"><span class="hint">按训练内容筛选：</span><div class="chipRow">' + filterChips + '</div></div>' +
        cards;
    }
    /* 阶段成绩对比：按周期计划阶段分组该阶段最佳成绩，相邻阶段对比 */
    function renderPhaseCompare(a) {
      var plan = DB.cycle[a.id];
      var cs = DB.cycleStart[a.id];
      if (!plan || !plan.phases || !cs) return '';
      var recs = cleanRecs(DB.results[a.id] || []);
      var csDate = new Date(cs + 'T00:00:00').getTime();
      /* 每阶段计划完成率：该阶段所属周的已勾选格子 / 总格子 */
      var phaseWeekIdx = {};
      for (var pw = 0; pw < plan.rows.length; pw++) {
        var pn0 = plan.phases[pw] || '';
        if (!phaseWeekIdx[pn0]) phaseWeekIdx[pn0] = [];
        phaseWeekIdx[pn0].push(pw);
      }
      var phaseDone = {};
      for (var pn1 in phaseWeekIdx) {
        var idxs = phaseWeekIdx[pn1], done = 0, tot = 0;
        for (var ii = 0; ii < idxs.length; ii++) for (var dd = 0; dd < 7; dd++) {
          var cc = plan.rows[idxs[ii]][dd];
          tot++;
          if (cc && cc.done) done++;
        }
        phaseDone[pn1] = tot ? Math.round(done / tot * 100) : 0;
      }
      var per = {};
      for (var i = 0; i < recs.length; i++) {
        var rc = recs[i];
        var d = new Date(rc.date + 'T00:00:00').getTime();
        if (d < csDate) continue;
        var w = Math.floor((d - csDate) / 86400000 / 7);
        if (w < 0 || w >= plan.phases.length) continue;
        var ph = plan.phases[w];
        var t = num(rc.time);
        if (t <= 0) continue;
        if (!per[ph]) per[ph] = {};
        var maxMode = isStrengthItem(rc.item);
        if (!per[ph][rc.item] || (maxMode ? t > per[ph][rc.item] : t < per[ph][rc.item])) per[ph][rc.item] = t;
      }
      var items2 = [];
      for (var ph2 in per) for (var it2 in per[ph2]) if (items2.indexOf(it2) < 0) items2.push(it2);
      if (!items2.length) return '';
      var ths = '<th>阶段</th><th>计划完成率</th>';
      for (var t3 = 0; t3 < items2.length; t3++) ths += '<th>' + esc(items2[t3]) + '</th>';
      var rows = '';
      var prev = null, bestImprove = null, bestImprovePh = null;
      for (var p = 0; p < plan.phases.length; p++) {
        var phn = plan.phases[p];
        var cells = '', phaseDiff = 0, cnt = 0;
        for (var c2 = 0; c2 < items2.length; c2++) {
          var it = items2[c2];
          var cur = per[phn] ? per[phn][it] : null;
          var pr = prev && prev[it] != null ? prev[it] : null;
          var cell = cur != null ? cur.toFixed(2) : '—';
          if (cur != null && pr != null) {
            var diff = isStrengthItem(it) ? (cur - pr) : (pr - cur);
            phaseDiff += diff; cnt++;
            var arrow = Math.abs(diff) < 0.005 ? '→' : (diff > 0 ? '↑' : '↓');
            var cls = Math.abs(diff) < 0.005 ? 'plain' : (diff > 0 ? 'ok' : 'bad');
            cell = cur.toFixed(2) + ' <span class="tag ' + cls + '" style="padding:0 6px;font-size:10px">' + arrow + ' ' + Math.abs(diff).toFixed(2) + '</span>';
          }
          cells += '<td>' + cell + '</td>';
        }
        if (cnt > 0 && (bestImprove === null || phaseDiff > bestImprove)) { bestImprove = phaseDiff; bestImprovePh = phn; }
        var pc = phaseDone[phn] != null ? phaseDone[phn] : 0;
        var pcTag = pc >= 80 ? '<span class="tag ok">' + pc + '%</span>' : pc >= 50 ? '<span class="tag warn">' + pc + '%</span>' : '<span class="tag bad">' + pc + '%</span>';
        rows += '<tr><td class="weekLbl">' + esc(phn) + '</td><td>' + pcTag + '</td>' + cells + '</tr>';
        if (per[phn]) prev = per[phn];
      }
      var banner = bestImprovePh ? '<div class="hint mt8">🏆 进步最大的阶段：<span class="tag ok">' + esc(bestImprovePh) + '</span>（跨条目累计进步幅度最大）</div>' : '';
      return '<div class="card"><div class="cardTitle">阶段成绩对比（按周期计划阶段）</div>' +
        '<div class="tableWrap"><table class="tbl" style="min-width:520px"><thead><tr>' + ths + '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
        banner +
        '<div class="hint mt8">每格 = 该阶段该条目的最佳成绩（顺风超 2.0m/s 不计）；箭头为相对上一阶段的差值（↑ 进步绿 / ↓ 退步红 / → 持平）。完成率 = 该阶段计划格子勾选比例，可对照「执行多少 ↔ 进步多少」。需先生成周期计划并设置周期起始日。</div></div>';
    }

    /* 成绩汇总：全队横向比较（按条目排名） */
    function renderCompare() {
      var v = document.getElementById('view');
      if (!DB.athletes.length) {
        v.innerHTML = '<div class="card"><div class="empty">' + ico('chart') + '<span>还没有运动员，先到「运动员」页添加并记录成绩</span>' +
          '<button class="btn btnPrimary btnSm" data-act="tab" data-tab="athletes">去添加</button></div></div>';
        return;
      }
      var items = [], itemSet = {};
      for (var i = 0; i < DB.athletes.length; i++) {
        var recs = DB.results[DB.athletes[i].id] || [];
        for (var j = 0; j < recs.length; j++) {
          var it = recs[j].item;
          if (!itemSet[it]) { itemSet[it] = true; items.push(it); }
        }
      }
      items.sort(function (a, b) {
        var ia = STRENGTH_ITEMS.indexOf(a), ib = STRENGTH_ITEMS.indexOf(b);
        if (ia >= 0 && ib >= 0) return ia - ib;
        if (ia >= 0) return -1;
        if (ib >= 0) return 1;
        return items.indexOf(a) - items.indexOf(b);
      });
      if (!items.length) {
        v.innerHTML = '<div class="card"><div class="empty">' + ico('chart') + '<span>还没有成绩记录，先到「成绩」页记录</span></div></div>';
        return;
      }
      if (S.cmpMode === 'day') {
        if (!S.cmpDate) {
          var lastDate = '';
          for (var i2 = 0; i2 < DB.athletes.length; i2++) {
            var rs = DB.results[DB.athletes[i2].id] || [];
            for (var j2 = 0; j2 < rs.length; j2++) if (rs[j2].date > lastDate) lastDate = rs[j2].date;
          }
          S.cmpDate = lastDate;
        }
        items = items.filter(function (itm2) {
          for (var i3 = 0; i3 < DB.athletes.length; i3++) {
            if ((DB.results[DB.athletes[i3].id] || []).some(function (x) { return x.item === itm2 && x.date === S.cmpDate; })) return true;
          }
          return false;
        });
        if (!items.length) {
          v.innerHTML = '<div class="card"><div class="empty">' + ico('chart') + '<span>所选日期（' + esc(S.cmpDate) + '）没有成绩记录，换个日期或先到「成绩」页记录</span></div></div>';
          return;
        }
      }
      function bestFor(aid, item) {
        if (S.cmpMode === 'day') {
          var dayList = cleanRecs((DB.results[aid] || []).filter(function (x) { return x.item === item && x.date === S.cmpDate; }));
          return bestOf(dayList, isStrengthItem(item));
        }
        var list = cleanRecs((DB.results[aid] || []).filter(function (x) { return x.item === item; }));
        if (S.cmpMode === 'cycle') {
          var cs = DB.cycleStart[aid];
          list = cs ? cleanRecs(list.filter(function (x) { return x.date >= cs; })) : [];
        }
        return bestOf(list, isStrengthItem(item));
      }
      function cmpAvg(item) {
        if (S.cmpMode === 'day') {
          var vals = [];
          for (var i4 = 0; i4 < DB.athletes.length; i4++) {
            var b4 = bestFor(DB.athletes[i4].id, item);
            if (b4 !== null) vals.push(b4);
          }
          if (!vals.length) return null;
          var s4 = 0;
          for (var j4 = 0; j4 < vals.length; j4++) s4 += vals[j4];
          return { avg: s4 / vals.length, n: vals.length };
        }
        return teamAvg(item);
      }
      var ranks = {};
      for (var it2 = 0; it2 < items.length; it2++) {
        var item = items[it2];
        var vals = [];
        for (var ai = 0; ai < DB.athletes.length; ai++) {
          var val = bestFor(DB.athletes[ai].id, item);
          if (val !== null) vals.push({ aid: DB.athletes[ai].id, val: val });
        }
        vals.sort(function (x, y) { return isStrengthItem(item) ? y.val - x.val : x.val - y.val; });
        var r = {};
        for (var k = 0; k < vals.length; k++) r[vals[k].aid] = k + 1;
        ranks[item] = r;
      }
      var ths = '<th>运动员</th>';
      for (var t2 = 0; t2 < items.length; t2++) ths += '<th>' + esc(items[t2]) + '</th>';
      var rows = '';
      for (var r2 = 0; r2 < DB.athletes.length; r2++) {
        var a = DB.athletes[r2];
        var cells = '';
        for (var c2 = 0; c2 < items.length; c2++) {
          var itm = items[c2];
          var val = bestFor(a.id, itm);
          var unit = isStrengthItem(itm) ? 'kg' : 's';
          var rank = ranks[itm][a.id];
          var cell = val !== null ? '<b>' + val.toFixed(2) + '</b> ' + unit : '—';
          if (val !== null) {
            if (rank === 1) cell += ' <span class="tag warn" style="padding:0 6px;font-size:10px">🥇1</span>';
            else if (rank === 2) cell += ' <span class="tag plain" style="padding:0 6px;font-size:10px">2</span>';
            else if (rank === 3) cell += ' <span class="tag plain" style="padding:0 6px;font-size:10px">3</span>';
          }
          cells += '<td>' + cell + '</td>';
        }
        rows += '<tr><td class="weekLbl">' + esc(a.name) + '</td>' + cells + '</tr>';
      }
      var avgCells = '';
      for (var c3 = 0; c3 < items.length; c3++) {
        var ta = cmpAvg(items[c3]);
        avgCells += '<td class="sub">' + (ta ? '<b>' + ta.avg.toFixed(2) + '</b> <span class="tag plain" style="padding:0 5px">' + ta.n + '人</span>' : '—') + '</td>';
      }
      rows += '<tr style="background:rgba(148,163,184,.06)"><td class="weekLbl">全队平均</td>' + avgCells + '</tr>';

      var modeChips = '<div class="chipRow"><span class="hint" style="font-weight:600">对比口径：</span>' +
        '<button class="chip' + (S.cmpMode === 'hist' ? ' on' : '') + '" data-act="cmpMode" data-mode="hist">历史最佳</button>' +
        '<button class="chip' + (S.cmpMode === 'cycle' ? ' on' : '') + '" data-act="cmpMode" data-mode="cycle">周期最佳</button>' +
        '<button class="chip' + (S.cmpMode === 'day' ? ' on' : '') + '" data-act="cmpMode" data-mode="day">按天对比</button>' +
      '</div>';
      var dateRow = '';
      var tip = '每格 = 该运动员该条目的最佳成绩（顺风超 2.0m/s 不计）；每列按成绩排名，🥇 为该条目全队第一。周期最佳按各运动员周期起始日起算，未设周期起始日的显示 —。';
      if (S.cmpMode === 'day') {
        dateRow = '<div class="row mt8"><span class="hint">对比日期：</span><input class="inp" type="date" id="cmpDateInp" value="' + esc(S.cmpDate || todayStr()) + '" style="width:150px;padding:5px 9px" data-act="cmpDate" /><span class="grow"></span><span class="hint">默认最近一次有成绩的日期</span></div>';
        tip = '当天各运动员该条目的成绩（同一天多次取最佳，顺风超 2.0 不计排名）；每列排名，🥇 当天第一；全队平均 = 当天有记录运动员的平均。';

    /* 生成 50 名测试运动员 + 近28天状态 + 成绩（用于测试趋势/风险/Dashboard） */
    function genTestData() {
      var msg = DB.athletes.length
        ? '将追加生成 50 名测试运动员及其近28天状态、成绩数据（不覆盖现有数据）。继续？'
        : '生成 50 名测试运动员（16-22岁）及近28天状态、成绩数据？';
      if (!confirm(msg)) return;
      function rnd(a, b) { return Math.round(a + Math.random() * (b - a)); }
      var surnames = ['李', '王', '张', '刘', '陈', '杨', '赵', '黄', '周', '吴', '徐', '孙', '马', '朱', '胡', '郭', '何', '高', '林', '罗'];
      var names = ['伟', '强', '磊', '军', '洋', '勇', '杰', '涛', '明', '超', '刚', '平', '辉', '鹏', '华', '飞', '宇', '航', '浩', '轩', '浩然', '一鸣', '思远', '子涵', '梓'];
      var events = ['短跑100米', '短跑200米', '跨栏110米', '800米', '1500米'];
      var used = {};
      var today = todayStr();
      var p2 = function (x) { return String(x).padStart(2, '0'); };
      function dateAgo(days) {
        var dt = new Date(new Date(today + 'T00:00:00').getTime() - days * 86400000);
        return dt.getFullYear() + '-' + p2(dt.getMonth() + 1) + '-' + p2(dt.getDate());
      }
      if (!DB.wellness) DB.wellness = {};
      if (!DB.results) DB.results = {};
      for (var i = 0; i < 50; i++) {
        var name;
        do { name = surnames[rnd(0, surnames.length - 1)] + names[rnd(0, names.length - 1)]; } while (used[name]);
        used[name] = true;
        var event = events[rnd(0, events.length - 1)];
        var isDist = ['30米', '60米', '100米'].indexOf(event.split('米')[0] + '米') >= 0 || event.indexOf('短跑') >= 0;
        var a = {
          id: uid(), name: name, height: rnd(165, 195), weight: rnd(55, 90),
          event: event, age: rnd(16, 22), note: '测试数据', testDay: '',
          strength: { squat: rnd(100, 180), halfSquat: rnd(140, 240), clean: rnd(70, 120), bench: rnd(60, 110) },
          items: ['30米', '60米', '100米']
        };
        DB.athletes.push(a);
        DB.wellness[a.id] = [];
        var injured = Math.random() < 0.10;
        for (var d = 27; d >= 0; d--) {
          var ds = dateAgo(d);
          var sleepH = Math.round((6.3 + Math.random() * 3.2) * 10) / 10;
          var sleepQ = rnd(4, 10), fatigue = rnd(2, 9), soreness = rnd(2, 9), mood = rnd(4, 10), readiness = rnd(3, 10);
          if (Math.random() < 0.20) fatigue = rnd(7, 9);
          if (Math.random() < 0.15) sleepH = Math.round((5.5 + Math.random() * 1.4) * 10) / 10;
          var inj = '无';
          if (injured) inj = Math.random() < 0.5 ? '轻微' : '需要关注';
          DB.wellness[a.id].push({ id: uid(), date: ds, sleep_hours: sleepH, sleep_quality: sleepQ, fatigue_score: fatigue, soreness_score: soreness, mood_score: mood, readiness_score: readiness, injury_status: inj, note: '' });
        }
        DB.results[a.id] = [];
        var distItems = ['30米', '60米', '100米'];
        var strItems = ['深蹲', '高翻'];
        for (var k = 0; k < distItems.length; k++) {
          var item = distItems[k];
          var base = item === '30米' ? 4.1 : item === '60米' ? 7.1 : 11.8;
          for (var r = 0; r < 10; r++) {
            var ds2 = dateAgo(27 - r * 3);
            var val = Math.round((base - r * 0.05 + (Math.random() * 0.12 - 0.06)) * 100) / 100;
            var wind = Math.random() < 0.3 ? (Math.round((Math.random() * 3 - 1) * 10) / 10).toString() : '';
            DB.results[a.id].push({ id: uid(), item: item, date: ds2, time: val, note: '', wind: wind, timing: '' });
          }
        }
        for (var k2 = 0; k2 < strItems.length; k2++) {
          var item2 = strItems[k2];

          for (var r2 = 0; r2 < 6; r2++) {

          }
        }
      }

    /* ================= 快捷保存（回车/按钮共用） ================= */
    function doRecSave() {
      var ra = getAthlete(S.sel);
      if (!ra) return;
      var customInp = document.getElementById('recCustom');
      var custom = customInp ? customInp.value.trim() : '';
      var item = custom || S.recItem;
      if (!item) { alert('请选择或输入训练内容'); return; }
      var maxMode = isStrengthItem(item);
      var tVal = parseFloat(document.getElementById('recTime').value);
      if (!isFinite(tVal) || tVal <= 0) { alert('请输入有效的成绩（' + (maxMode ? 'kg' : '秒') + '，大于 0）'); return; }
      var date = document.getElementById('recDate').value || todayStr();
      S.recDate = date;
      S.recCustom = custom;
      var note = document.getElementById('recNote').value.trim();
      var windInp = document.getElementById('recWind');
      var wind = windInp ? windInp.value.trim() : '';
      var timingInp = document.getElementById('recTiming');
      var timing = timingInp ? timingInp.value : '';
      if (!DB.results[S.sel]) DB.results[S.sel] = [];
      var list2 = DB.results[S.sel];
      var prevHist = bestOf(cleanRecs(list2.filter(function (x) { return x.item === item; })), maxMode);
      var rec = { id: uid(), item: item, date: date, time: tVal, note: note, wind: wind, timing: timing };
      list2.push(rec);
      var newHist = bestOf(cleanRecs(list2.filter(function (x) { return x.item === item; })), maxMode);
      var improved = newHist !== null && (prevHist === null || (maxMode ? (newHist > prevHist) : (newHist < prevHist)));
      var msg = null, broke = false;
      if (improved) { msg = '🏆 新历史最佳：' + item + ' ' + tVal.toFixed(2) + (maxMode ? 'kg' : 's'); broke = true; }
      var cs = DB.cycleStart[S.sel] || '';
      if (cs && date >= cs) {
        var cycB = bestOf(cleanRecs(list2.filter(function (x) { return x.item === item && x.date >= cs; })), maxMode);
        if (cycB !== null && Math.abs(cycB - tVal) < 1e-9 && !broke) msg = '🎖 新周期最佳：' + item + ' ' + tVal.toFixed(2) + (maxMode ? 'kg' : 's');
      }
      save(); renderView();
      if (msg) alert(msg);
      setTimeout(function () { var ti = document.getElementById('recTime'); if (ti) { ti.value = ''; ti.focus(); } }, 60);
    }

        for (var w6 = 0; w6 < p4.rows.length; w6++) for (var d4 = 0; d4 < 7; d4++) p4.rows[w6][d4] = emptyCell();
        save(); renderView();
      } else if (act === 'exportData') {
        var blob = new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'Coach Work-备份.json';
        a.click();
        URL.revokeObjectURL(a.href);
      } else if (act === 'exportTemplate') {
        var tpl = JSON.stringify(defaults(), null, 2);
        var blob2 = new Blob([tpl], { type: 'application/json' });
        var a2 = document.createElement('a');
        a2.href = URL.createObjectURL(blob2);
        a2.download = 'Coach Work-模板（空）.json';
        a2.click();
        URL.revokeObjectURL(a2.href);
      } else if (act === 'downloadTemplate' || act === 'templateLink') {
        fetch(location.href).then(function (r) { return r.text(); }).then(function (src) {
          if (act === 'downloadTemplate') {
            var blob3 = new Blob([src], { type: 'text/html;charset=utf-8' });
            var a3 = document.createElement('a');
            a3.href = URL.createObjectURL(blob3);
            a3.download = 'Coach Work-模板（空）.html';
            a3.click();
            URL.revokeObjectURL(a3.href);
          } else {
            var link = 'data:text/html;charset=utf-8;base64,' + btoa(unescape(encodeURIComponent(src)));
            var ta = document.createElement('textarea');
            ta.value = link;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            var copied = false;
            try { copied = document.execCommand('copy'); } catch (e) {}
            document.body.removeChild(ta);
            if (copied) {
              alert('✅ 空白模板链接已复制！直接粘贴发给别人，对方在浏览器地址栏打开该链接即可使用（无任何数据）。\n提示：链接较长，若发送工具截断，请改用「下载模板 HTML」按钮。');
            } else {
              alert('自动复制失败，请用「下载模板 HTML」按钮导出文件分享。');
            }
          }
        }).catch(function () {
          alert('当前页面打开方式无法读取模板源码（桌面版 file:// 下受限），请改在工作台窗口版操作，或用「导出空白模板 JSON」。');
        });
      } else if (act === 'genTestData') {
        genTestData();
      } else if (act === 'pickImport') {
        document.getElementById('importFile').click();
      } else if (act === 'clearAll') {
        autoBackup('Coach Work-清空前自动备份');
        if (confirm('将清空全部数据（已自动下载一份当前数据备份）。确定清空？')) {
          DB = defaults();
          S.editId = null; S.sel = null;
          save(); renderSidebar(); renderView();
        }
      }
    });

    /* 计划格子：右键 = 快速完成/取消完成（左键 = 编辑） */
    document.addEventListener('contextmenu', function (e) {
      var el = e.target.closest('[data-act="editCell"]');
      if (!el) return;
      e.preventDefault();
      var kind = el.getAttribute('data-kind');
      var w = +el.getAttribute('data-w'), d = +el.getAttribute('data-d');
      var planC2 = ensurePlan(kind, S.sel);
      var c2 = planC2.rows[w][d] || emptyCell();
      c2.done = !c2.done;
      save(); renderView();
    });

    /* 回车快捷保存：成绩输入框 Enter 直接保存并连续录入；计划浮层 Enter 保存（Shift+Enter 换行） */
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      var t = e.target;
      if (t && t.id === 'recTime') { e.preventDefault(); doRecSave(); }
      else if (t && t.id === 'ceText' && !e.shiftKey) { e.preventDefault(); doCellSave(); }
    });

    document.addEventListener('change', function (e) {
      var el = e.target;
      if (el.id === 'importFile') {
        var f = el.files && el.files[0];
        if (!f) return;
        var rd = new FileReader();
        rd.onload = function () {
          try {
            var d = JSON.parse(rd.result);
            if (!d || !Array.isArray(d.athletes)) throw new Error('bad');
            autoBackup('Coach Work-导入前自动备份');
            if (!confirm('导入将覆盖当前数据（已自动下载一份备份）。确定继续？')) return;
            DB = Object.assign(defaults(), d);
            S.editId = null; S.sel = null;
            save(); renderSidebar(); renderView();
          } catch (err) { alert('导入失败：文件不是有效的备份 JSON'); }
        };
        rd.readAsText(f);
        el.value = '';
      } else if (el.getAttribute && el.getAttribute('data-act') === 'injurySet') {
        var iaid = el.getAttribute('data-id');
        var iw = todayWellness(iaid);
        if (iw) { iw.injury_status = el.value; save(); }
      } else if (el.getAttribute('data-act') === 'cmpDate') {
        S.cmpDate = el.value;
        renderView();
      } else if (el.getAttribute('data-act') === 'cycleWeeks') {
        var n = Math.max(1, Math.min(12, parseInt(el.value, 10) || 1));
        var plan = ensurePlan('cycle', S.sel);
        plan.weeks = n;
        while (plan.rows.length < n) {
          var row = [];
          for (var d = 0; d < 7; d++) row.push(emptyCell());
          plan.rows.push(row);
        }
        plan.rows.length = n;
        while (plan.phases.length < n) plan.phases.push('第' + (plan.phases.length + 1) + '周');
        plan.phases.length = n;
        save(); renderView();
      }
    });

    document.addEventListener('input', function (e) {
      var el = e.target;
      if (el.classList && el.classList.contains('wellRange')) {
        var v2 = document.getElementById(el.id + '_v');
        if (v2) v2.textContent = el.value;
      }
      if (el.id === 'gsearch') {
        S.q = el.value;
        if (S.tab === 'athletes') renderView();
      } else if (el.getAttribute && el.getAttribute('data-act') === 'phase') {
        var plan = ensurePlan('cycle', S.sel);
        plan.phases[+el.getAttribute('data-w')] = el.value;
        save();
      }
    });

    function renderView() {
      if (S.tab === 'overview') renderOverview();
      else if (S.tab === 'athletes') renderAthletes();
      else if (S.tab === 'wellness') renderWellness();
      else if (S.tab === 'results') renderResults();
      else if (S.tab === 'compare') renderCompare();
      else if (S.tab === 'items') renderItems();
      else if (S.tab === 'month') renderPlanTable('month');
      else if (S.tab === 'cycle') renderPlanTable('cycle');
      save();
    }

    applyTheme();
    renderSidebar();
    renderView();
    checkUpdate();
  })();
  </script>
</body>
</html>
