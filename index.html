        '<div class="chipRow">' + chips + '</div>' +
        modeChips() +
        '<div class="hint mt8">一般准备 → 专项准备 → 赛前 → 比赛/过渡；两种训练模式生成不同风格的每日内容，阶段名与内容自动填入，可再手动微调。</div>' +
        '</div>';
    }

    /* ================= 阶段成绩对比 ================= */
    function renderPhaseCompare(a) {
      var plan = DB.cycle[a.id];
      var cs = DB.cycleStart[a.id];
      if (!plan || !plan.phases || !cs) return '';
      var recs = cleanRecs(DB.results[a.id] || []);
      var csDate = new Date(cs + 'T00:00:00').getTime();
      var phaseWeekIdx = {};
      for (var pw = 0; pw < plan.rows.length; pw++) {
        var pn0 = plan.phases[pw] || '';
        if (!phaseWeekIdx[pn0]) phaseWeekIdx[pn0] = [];
        phaseWeekIdx[pn0].push(pw);
      }
      var phaseDone = {};
      for (var pn1 in phaseWeekIdx) {
        var idxs = phaseWeekIdx[pn1], done = 0, tot = 0;
        for (var ii = 0; ii < idxs.length; ii++) for (var dd = 0; dd < 7; dd++) {
          var cc = plan.rows[idxs[ii]][dd];
          if (!cc || !String(cc.t || '').trim()) continue;
          tot++;
          if (cc && cc.done) done++;
        }
        phaseDone[pn1] = tot ? Math.round(done/tot*100) : 0;
      }
      var per = {};
      for (var i = 0; i < recs.length; i++) {
        var rc = recs[i];
        var d = new Date(rc.date + 'T00:00:00').getTime();
        if (d < csDate) continue;
        var w = Math.floor((d - csDate) / 86400000 / 7);
        if (w < 0 || w >= plan.phases.length) continue;
        var ph = plan.phases[w];
        var t = num(rc.time);
        if (t <= 0) continue;
        var direction = getEventDirection(rc.item);
        if (direction === 'unknown') continue;
        if (!per[ph]) per[ph] = {};
        var maxMode = direction === 'higher';
        if (!per[ph][rc.item] || (maxMode ? t > per[ph][rc.item] : t < per[ph][rc.item])) per[ph][rc.item] = t;
      }
      var items2 = [];
      for (var ph2 in per) for (var it2 in per[ph2]) if (items2.indexOf(it2) < 0) items2.push(it2);
      if (!items2.length) return '';
      var ths = '<th>阶段</th><th>计划完成率</th>';
      for (var t3 = 0; t3 < items2.length; t3++) ths += '<th class="textRight">' + esc(items2[t3]) + '</th>';
      var rows = '';
      var prev = null, bestImprove = null, bestImprovePh = null;
      for (var p = 0; p < plan.phases.length; p++) {
        var phn = plan.phases[p];
        var cells = '', phaseDiff = 0, cnt = 0;
        for (var c2 = 0; c2 < items2.length; c2++) {
          var it = items2[c2];
          var cur = per[phn] ? per[phn][it] : null;
          var pr = prev && prev[it] != null ? prev[it] : null;
          var cell = cur != null ? cur.toFixed(2) : '—';
          if (cur != null && pr != null) {
            var diff = isStrengthItem(it) ? (cur - pr) : (pr - cur);
            phaseDiff += diff; cnt++;
            var arrow = Math.abs(diff) < 0.005 ? '→' : (diff > 0 ? '↑' : '↓');
            var cls = Math.abs(diff) < 0.005 ? 'muted' : (diff > 0 ? 'good' : 'danger');
            cell = cur.toFixed(2) + ' <span class="badge ' + cls + ' plainDot" style="font-size:10px">' + arrow + ' ' + Math.abs(diff).toFixed(2) + '</span>';
          }
          cells += '<td class="numCell">' + cell + '</td>';
        }
        if (cnt > 0 && (bestImprove === null || phaseDiff > bestImprove)) { bestImprove = phaseDiff; bestImprovePh = phn; }
        var pc = phaseDone[phn] != null ? phaseDone[phn] : 0;
        var pcTag = pc >= 80 ? '<span class="badge good plainDot">' + pc + '%</span>' : pc >= 50 ? '<span class="badge warning plainDot">' + pc + '%</span>' : '<span class="badge danger plainDot">' + pc + '%</span>';
        rows += '<tr><td class="weekLbl">' + esc(phn) + '</td><td>' + pcTag + '</td>' + cells + '</tr>';
        if (per[phn]) prev = per[phn];
      }
      var banner = bestImprovePh ? '<div class="hint mt8">进步最大的阶段：<span class="badge good plainDot">' + esc(bestImprovePh) + '</span>（跨项目累计进步幅度最大）</div>' : '';
      return '<div class="card mt16"><div class="cardHeader"><div><div class="title">阶段成绩对比</div><div class="subtitle">按周期计划阶段分组，相邻阶段对比</div></div></div>' +
        '<div class="tableWrap" style="border:none;background:transparent"><table class="tbl" style="min-width:520px"><thead><tr>' + ths + '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
        banner +
        '<div class="hint mt8">每格 = 该阶段该项目的最佳成绩（超风速>2.0m/s 不计）；箭头为相对上一阶段的差值（↑进步绿 / ↓退步红 / →持平）。完成率 = 该阶段计划格子勾选比例。需先生成周期计划并设置周期起始日。</div></div>';
    }

    /* ================= Excel 导出 ================= */
    function escX(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) {
        return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;' }[m];
      });
    }
    function xlsCell(v, num) {
      return '<Cell><Data ss:Type="' + (num ? 'Number' : 'String') + '">' + (num ? v : escX(v)) + '</Data></Cell>';
    }
    function exportExcel() {
      var sheet1 = '<Row>' + xlsCell('运动员') + xlsCell('项目') + xlsCell('身高') + xlsCell('体重') + xlsCell('深蹲') + xlsCell('半蹲') + xlsCell('高翻') + xlsCell('卧推') + '</Row>';
      for (var i = 0; i < DB.athletes.length; i++) {
        var a = DB.athletes[i];
        sheet1 += '<Row>' + xlsCell(a.name) + xlsCell(a.event || '') + xlsCell(a.height || '', true) + xlsCell(a.weight || '', true) +
          xlsCell(a.strength.squat || '', true) + xlsCell(a.strength.halfSquat || '', true) + xlsCell(a.strength.clean || '', true) + xlsCell(a.strength.bench || '', true) + '</Row>';
      }
      var sheet2 = '<Row>' + xlsCell('运动员') + xlsCell('项目') + xlsCell('历史最佳') + '</Row>';
      for (var j = 0; j < DB.athletes.length; j++) {
        var aid = DB.athletes[j].id;
        var recs = DB.results[aid] || [];
        var items = {};
        for (var k = 0; k < recs.length; k++) {
          var r = recs[k];
          if (!items[r.item]) items[r.item] = [];
          items[r.item].push(r);
        }
        for (var it in items) {
          var b = bestOf(cleanRecs(items[it]), isStrengthItem(it));
          if (b !== null) sheet2 += '<Row>' + xlsCell(DB.athletes[j].name) + xlsCell(it) + xlsCell(b.toFixed(2), true) + '</Row>';
        }
      }
      var xml = '<?xml version="1.0"?><?mso-application progid="Excel.Sheet"?>' +
        '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">' +
        '<Worksheet ss:Name="运动员档案"><Table>' + sheet1 + '</Table></Worksheet>' +
        '<Worksheet ss:Name="最佳成绩"><Table>' + sheet2 + '</Table></Worksheet>' +
        '</Workbook>';
      var blob = new Blob(['﻿' + xml], { type:'application/vnd.ms-excel;charset=utf-8' });
      var a2 = document.createElement('a');
      a2.href = URL.createObjectURL(blob);
      a2.download = 'Coach Work成绩.xls';
      a2.click();
      URL.revokeObjectURL(a2.href);
      toast('数据已导出为 Excel', 'success');
    }

    /* ================= 快速保存 ================= */
    function doRecSave() {
      var ra = getAthlete(S.sel);
      if (!ra) return;
      var customInp = document.getElementById('recCustom');
      var custom = customInp ? customInp.value.trim() : '';
      var item = custom || S.recItem;
      if (!item) { toast('请选择或输入训练内容', 'error'); return; }
      var baseConfig = getEventConfig(item);
      var unitInp = document.getElementById('recUnit');
      var directionInp = document.getElementById('recDirection');
      var resultUnit = unitInp ? unitInp.value.trim() : baseConfig.unit;
      var direction = directionInp ? directionInp.value : baseConfig.direction;
      if (custom) {
        DB.eventConfigs[item] = { unit:resultUnit, direction:direction, windApplicable:baseConfig.windApplicable, timingApplicable:baseConfig.timingApplicable };
      }
      var knownDirection = direction !== 'unknown';
      var maxMode = direction === 'higher';
      var tVal = parseFloat(document.getElementById('recTime').value);
      if (!isFinite(tVal) || tVal <= 0) { toast('请输入大于 0 的有效成绩数值', 'error'); return; }
      var date = document.getElementById('recDate').value || todayStr();
      if (date > todayStr()) { toast('成绩日期不能晚于今天', 'error'); return; }
      S.recDate = date;
      S.recCustom = custom;
      var note = document.getElementById('recNote').value.trim();
      var windInp = document.getElementById('recWind');
      var wind = windInp ? windInp.value.trim() : '';
      var timingInp = document.getElementById('recTiming');
      var timing = timingInp ? timingInp.value : '';
      if (!DB.results[S.sel]) DB.results[S.sel] = [];
      var list2 = DB.results[S.sel];
      var prevHist = knownDirection ? bestOf(cleanRecs(list2.filter(function (x) { return x.item === item; })), maxMode) : null;
      var rec = { id:uid(), item:item, date:date, time:tVal, unit:resultUnit, direction:direction, note:note };
      if (baseConfig.windApplicable && wind) rec.wind = wind;
      if (baseConfig.timingApplicable && timing) rec.timing = timing;
      list2.push(rec);
      var newHist = knownDirection ? bestOf(cleanRecs(list2.filter(function (x) { return x.item === item; })), maxMode) : null;
      var improved = knownDirection && newHist !== null && (prevHist === null || (maxMode ? (newHist > prevHist) : (newHist < prevHist)));
      var msg = null, broke = false;
      if (improved) { msg = '新历史最佳：' + item + ' ' + tVal.toFixed(2) + resultUnit; broke = true; }
      var cs = DB.cycleStart[S.sel] || '';
      if (knownDirection && cs && date >= cs) {
        var cycB = bestOf(cleanRecs(list2.filter(function (x) { return x.item === item && x.date >= cs; })), maxMode);
        if (cycB !== null && Math.abs(cycB - tVal) < 1e-9 && !broke) msg = '新周期最佳：' + item + ' ' + tVal.toFixed(2) + resultUnit;
      }
      save(); renderView();
      if (msg) toast(msg, 'success'); else toast('成绩已记录', 'success');
      setTimeout(function () { var ti = document.getElementById('recTime'); if (ti) { ti.value = ''; ti.focus(); } }, 60);
    }

    /* ================= 分析 / 报告 页面 ================= */

      /* 列出有平台期/表现变化的运动员；方向未知的项目不参与判断。 */

        '</div></div></div>' +

      v.innerHTML = '<div class="card"><div class="cardHeader"><div><div class="title">数据报告与导出</div><div class="subtitle">导出数据备份、Excel报表、空白模板</div></div></div>' +

        renderView();
      } else if (el.getAttribute('data-act') === 'athleteEventFilter') {
        S.athleteEventFilter = el.value || 'all'; renderView();
      } else if (el.id === 'recCustom') {
        S.recCustom = el.value.trim(); renderView();
      } else if (el.getAttribute('data-act') === 'cycleWeeks') {
        var n = Math.max(1, Math.min(12, parseInt(el.value, 10) || 1));
        var plan = ensurePlan('cycle', S.sel);
        if (n < plan.rows.length) {
          var removedHasContent = plan.rows.slice(n).some(function (row) { return row.some(function (c) { return c && (String(c.t || '').trim() || c.done); }); });
          if (removedHasContent && !confirm('缩短周期会删除第 ' + (n + 1) + ' 周之后的已有内容。确定继续？')) { el.value = plan.rows.length; return; }
        }
        plan.weeks = n;
        while (plan.rows.length < n) {
          var row = [];
          for (var d = 0; d < 7; d++) row.push(emptyCell());
          plan.rows.push(row);
        }
        plan.rows.length = n;
        while (plan.phases.length < n) plan.phases.push('第' + (plan.phases.length + 1) + '周');
        plan.phases.length = n;
        save(); renderView();
      }
    });

    document.addEventListener('input', function (e) {
      var el = e.target;
      if (el.getAttribute && el.getAttribute('data-act') === 'drawerAthleteSearch') {
        var needle = el.value.trim().toLowerCase();
        var teamRows = document.querySelectorAll('#drawerBody [data-team-name]');
        for (var tri = 0; tri < teamRows.length; tri++) teamRows[tri].style.display = teamRows[tri].getAttribute('data-team-name').toLowerCase().indexOf(needle) >= 0 ? '' : 'none';
      }
      if (el.classList && el.classList.contains('wellRange')) {
        var v2 = document.getElementById(el.id + '_v');
        if (v2) v2.textContent = el.value;
      }
      if (el.id === 'gsearch') {
        S.q = el.value;
        if (S.tab === 'athletes') renderView();
      } else if (el.id === 'athleteSearch') {
        S.q = el.value; renderView();
      } else if (el.getAttribute && el.getAttribute('data-act') === 'phase') {
        var plan = ensurePlan('cycle', S.sel);
        plan.phases[+el.getAttribute('data-w')] = el.value;
        save();
      }
    });

    /* ================= 渲染路由 ================= */
    function renderView() {
      if (S.tab === 'overview') renderOverview();
      else if (S.tab === 'athletes') renderAthletes();
      else if (S.tab === 'wellness') renderWellness();
      else if (S.tab === 'results') renderResults();
      else if (S.tab === 'compare') renderCompare();
      else if (S.tab === 'items') renderItems();
      else if (S.tab === 'month') renderPlanTable('month');
      else if (S.tab === 'cycle') renderPlanTable('cycle');
      else if (S.tab === 'analysis') renderAnalysis();
      else if (S.tab === 'report') renderReport();
      else renderOverview();
      save();
    }

    /* ================= 初始化 ================= */
    /* 运动员状态填写模式：?mode=athlete-status&athlete=<id> 只显示填写页，不进后台 */
    var _urlMode = null, _urlAthlete = null;
    try {
      var _up = new URLSearchParams(location.search);
      _urlMode = _up.get('mode');
      _urlAthlete = _up.get('athlete');
    } catch (e) {}
    if (_urlMode === 'athlete-status') {
      renderAthleteStatusMode(_urlAthlete);
      return;
    }
    applyTheme();
    renderSidebar();
    renderView();
    window.__cwTest = {
      getRiskGroups:getRiskGroups,
      getTodayWellnessStatus:getTodayWellnessStatus,
      categories:function () { return DB.athletes.map(function (a) { return classifyWellness(a).category; }); },
      getEventConfig:getEventConfig,
      state:function () { return { sel:S.sel, recItem:S.recItem, recFilter:S.recFilter }; },
      generateTestData30:generateTestData30,
      clearTestData:clearTestData,
      summary:function () { return { total:DB.athletes.length, test:DB.athletes.filter(function (a) { return a.isTestData; }).length, names:DB.athletes.map(function (a) { return a.name; }), eventConfigs:DB.eventConfigs, results:DB.results, wellness:DB.wellness }; }
    };
    checkUpdate();
  })();
  </script>
</body>
</html>
