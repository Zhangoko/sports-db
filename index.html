<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Coach Work" />
  <meta name="theme-color" content="#0B1220" />
  <title>Coach Work — Athlete Performance Platform</title>
  <style>
    /* ============================================================
       Coach Work — Premium Sports Analytics SaaS Design System
       4-Layer Hierarchy: Page → Sidebar → Card → Inner Component
       ============================================================ */
    :root{
      /* Level 1: Page Background */
      --bg-page:#0B1220;
      /* Level 2: Sidebar */
      --bg-sidebar:#0F172A;
      --bg-sidebar-hover:rgba(148,163,184,.06);
      /* Level 3: Dashboard Card */
      --bg-card:#111827;
      --bg-card-2:#1A2332;
      /* Level 4: Card inner / elevated */
      --bg-elevated:#1E293B;
      --bg-input:#0F172A;
      --bg-hover:rgba(148,163,184,.07);

      /* Borders */
      --border:rgba(148,163,184,.10);
      --border-2:rgba(148,163,184,.18);
      --border-primary:rgba(59,130,246,.30);

      /* Text */
      --text-primary:#F1F5F9;
      --text-secondary:#94A3B8;
      --text-muted:#64748B;
      --text-faint:#475569;

      /* Brand / Accent */
      --primary:#3B82F6;
      --primary-soft:rgba(59,130,246,.12);
      --primary-hover:#2563EB;
      --primary-glow:rgba(59,130,246,.25);

      /* Semantic */
      --success:#10B981;
      --success-soft:rgba(16,185,129,.12);
      --warning:#F59E0B;
      --warning-soft:rgba(245,158,11,.12);
      --danger:#EF4444;
      --danger-soft:rgba(239,68,68,.12);
      --purple:#8B5CF6;
      --purple-soft:rgba(139,92,246,.12);
      --cyan:#06B6D4;
      --cyan-soft:rgba(6,182,212,.12);

      /* Overlay */
      --overlay:rgba(4,7,12,.70);

      /* Radius */
      --radius-sm:8px;
      --radius:12px;
      --radius-lg:16px;
      --radius-xl:20px;
      --radius-pill:999px;

      /* Shadow */
      --shadow-sm:0 1px 3px rgba(0,0,0,.3);
      --shadow:0 4px 16px rgba(0,0,0,.25);
      --shadow-lg:0 12px 40px rgba(0,0,0,.4);
      --shadow-glow:0 0 24px rgba(59,130,246,.15);

      /* Spacing */
      --gap-card:20px;
      --gap-inner:16px;

      /* Compatibility aliases used by drawers and mobile navigation. */
      --bg:var(--bg-page);
      --surface:var(--bg-card);
      --surface-2:var(--bg-card-2);
      --surface-3:var(--bg-elevated);
      --text:var(--text-primary);

      /* Transitions */
      --ease:cubic-bezier(.4,0,.2,1);
      --dur-fast:150ms;
      --dur:200ms;

      color-scheme:dark;
    }
    html[data-theme="light"]{
      --bg-page:#F1F5F9;
      --bg-sidebar:#FFFFFF;
      --bg-sidebar-hover:rgba(15,23,42,.04);
      --bg-card:#FFFFFF;
      --bg-card-2:#F8FAFC;
      --bg-elevated:#F1F5F9;
      --bg-input:#F8FAFC;
      --bg-hover:rgba(15,23,42,.04);
      --border:rgba(15,23,42,.08);
      --border-2:rgba(15,23,42,.15);
      --border-primary:rgba(59,130,246,.30);
      --text-primary:#0F172A;
      --text-secondary:#475569;
      --text-muted:#94A3B8;
      --text-faint:#CBD5E1;
      --primary:#2563EB;
      --primary-soft:rgba(37,99,235,.08);
      --primary-hover:#1D4ED8;
      --overlay:rgba(15,23,42,.40);
      --shadow-sm:0 1px 3px rgba(15,23,42,.06);
      --shadow:0 4px 16px rgba(15,23,42,.08);
      --shadow-lg:0 12px 40px rgba(15,23,42,.12);
      --shadow-glow:0 0 24px rgba(37,99,235,.10);
      color-scheme:light;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      background:var(--bg-page);
      color:var(--text-primary);
      font-family:'Inter',system-ui,-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
      font-size:13.5px;
      line-height:1.55;
      overflow:hidden;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }
    ::-webkit-scrollbar{width:8px;height:8px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:4px}
    ::-webkit-scrollbar-thumb:hover{background:var(--text-muted)}
    button{font-family:inherit}
    .mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
    /* 运动员状态填写模式（专属链接） */
    #statusMode{display:none;min-height:100vh;padding:24px 16px 48px;flex-direction:column;align-items:center;background:var(--bg)}
    #statusMode.show{display:flex}
    .smCard{width:100%;max-width:520px}
    .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";font-weight:700}

    /* ============================================================
       App Layout: Sidebar (232px) + Main (Header + Content)
       ============================================================ */
    #app{display:grid;grid-template-columns:232px 1fr;height:100vh}

    /* ---------- Sidebar (Level 2) ---------- */
    .sidebar{
      background:var(--bg-sidebar);
      border-right:1px solid var(--border);
      display:flex;flex-direction:column;
      padding:18px 12px 14px;
      gap:2px;
      overflow-y:auto;
      overflow-x:hidden;
    }
    .sidebar::-webkit-scrollbar{width:4px}

    .logo{display:flex;align-items:center;gap:11px;padding:4px 8px 18px;border-bottom:1px solid var(--border);margin-bottom:14px}
    .logoMark{
      width:36px;height:36px;border-radius:10px;flex:none;
      display:flex;align-items:center;justify-content:center;
      background:transparent;
      overflow:hidden;
      box-shadow:none;
    }
    .coachWorkLogo{display:block;width:36px;height:36px;flex:none}
    .mobileBrandLogo{display:none;width:30px;height:30px;flex:none;overflow:hidden;border-radius:8px}
    .mobileBrandLogo .coachWorkLogo{width:30px;height:30px}
    .logoName{font-size:15px;font-weight:800;letter-spacing:.3px;color:var(--text-primary)}
    .logoSub{font-size:10px;color:var(--text-muted);line-height:1.3;margin-top:1px;letter-spacing:.2px}

    .nav-section{font-size:10px;font-weight:700;color:var(--text-faint);letter-spacing:1px;text-transform:uppercase;padding:14px 10px 6px}

    .nav{
      display:flex;align-items:center;gap:11px;
      padding:9px 12px;border-radius:10px;
      color:var(--text-secondary);font-size:13px;font-weight:500;
      cursor:pointer;border:none;background:none;width:100%;text-align:left;
      transition:all var(--dur-fast) var(--ease);
      position:relative;
    }
    .nav:hover{background:var(--bg-sidebar-hover);color:var(--text-primary)}
    .nav.on{background:rgba(59,130,246,.12);color:var(--primary);border-left:3px solid var(--primary);border-radius:0 8px 8px 0}
    .nav.on::before{
      content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);
      width:3px;height:22px;border-radius:0 3px 3px 0;background:var(--primary);
    }
    .nav svg{flex:none;opacity:.9}
    .nav .n{flex:1;white-space:nowrap}
    .nav .cnt{
      font-size:10.5px;color:var(--text-muted);
      background:var(--bg-elevated);border-radius:999px;
      padding:1px 7px;border:1px solid var(--border);
      font-weight:600;
    }
    .nav.on .cnt{background:var(--primary-soft);color:var(--primary);border-color:var(--border-primary)}

    .sideFoot{margin-top:auto;padding-top:14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:2px}

    .themeToggle{
      display:flex;align-items:center;justify-content:space-between;
      padding:9px 12px;border-radius:10px;
      color:var(--text-secondary);font-size:13px;font-weight:500;
      cursor:pointer;transition:all var(--dur-fast) var(--ease);
    }
    .themeToggle:hover{background:var(--bg-sidebar-hover);color:var(--text-primary)}
    .switch{
      width:36px;height:20px;border-radius:999px;
      background:var(--bg-elevated);border:1px solid var(--border);
      position:relative;transition:all var(--dur-fast) var(--ease);flex:none;
    }
    .switch::after{
      content:'';position:absolute;top:2px;left:2px;
      width:14px;height:14px;border-radius:50%;
      background:var(--text-muted);transition:all var(--dur-fast) var(--ease);
    }
    .switch.on{background:var(--primary-soft);border-color:var(--border-primary)}
    .switch.on::after{left:18px;background:var(--primary)}

    .coachProfile{
      display:flex;align-items:center;gap:10px;
      padding:10px 10px;margin-top:8px;
      border-radius:12px;
      background:var(--bg-card);
      border:1px solid var(--border);
    }
    .coachAvatar{
      width:34px;height:34px;border-radius:50%;flex:none;
      display:flex;align-items:center;justify-content:center;
      font-size:13px;font-weight:700;color:#fff;
      background:var(--primary);
    }
    .coachInfo{flex:1;min-width:0}
    .coachName{font-size:12.5px;font-weight:700;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .coachRole{font-size:10.5px;color:var(--text-muted)}

    /* ---------- Main Area ---------- */
    .main{display:flex;flex-direction:column;min-width:0;height:100vh}

    /* Header */
    .topbar{
      display:flex;align-items:center;gap:14px;
      padding:14px 24px;
      border-bottom:1px solid var(--border);
      background:var(--bg-sidebar);
      flex:none;
      backdrop-filter:blur(12px);
    }
    .topTitle{font-size:17px;font-weight:800;color:var(--text-primary);letter-spacing:-.2px}
    .topSub{font-size:11.5px;color:var(--text-muted);margin-top:1px}
    .grow{flex:1}

    .headerDate{
      display:flex;align-items:center;gap:7px;
      padding:7px 14px;border-radius:10px;
      background:var(--bg-card);border:1px solid var(--border);
      font-size:12.5px;font-weight:600;color:var(--text-secondary);
    }
    .headerDate svg{color:var(--text-muted)}

    .searchWrap{position:relative;width:220px}
    .searchWrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-muted)}
    .search{
      width:100%;padding:8px 12px 8px 34px;
      border-radius:10px;border:1px solid var(--border);
      background:var(--bg-input);color:var(--text-primary);
      font-size:12.5px;outline:none;transition:all var(--dur-fast) var(--ease);
      font-family:inherit;
    }
    .search:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
    .search::placeholder{color:var(--text-faint)}

    .iconBtn{
      width:36px;height:36px;border-radius:10px;
      border:1px solid var(--border);background:var(--bg-card);
      color:var(--text-secondary);cursor:pointer;
      display:inline-flex;align-items:center;justify-content:center;
      transition:all var(--dur-fast) var(--ease);position:relative;flex:none;
    }
    .iconBtn:hover{background:var(--bg-hover);color:var(--text-primary);border-color:var(--border-2)}
    .iconBtn .badgeDot{
      position:absolute;top:6px;right:6px;
      width:8px;height:8px;border-radius:50%;
      background:var(--danger);border:2px solid var(--bg-card);
    }

    .btn{
      display:inline-flex;align-items:center;gap:7px;
      padding:8px 16px;border-radius:10px;
      border:1px solid transparent;
      font-size:13px;font-weight:600;cursor:pointer;
      transition:all var(--dur-fast) var(--ease);
      background:none;color:var(--text-secondary);
      white-space:nowrap;
    }
    .btn:hover{color:var(--text-primary)}
    .btnPrimary{
      background:var(--primary);color:#fff;
      box-shadow:0 2px 8px rgba(59,130,246,.3);
    }
    .btnPrimary:hover{background:var(--primary-hover);color:#fff;box-shadow:0 4px 14px rgba(59,130,246,.4);transform:translateY(-1px)}
    .btnSecondary{
      background:var(--bg-card);border-color:var(--border);color:var(--text-secondary);
    }
    .btnSecondary:hover{background:var(--bg-hover);color:var(--text-primary);border-color:var(--border-2)}
    .btnGhost{border-color:var(--border);color:var(--text-secondary);background:transparent}
    .btnGhost:hover{border-color:var(--border-2);color:var(--text-primary);background:var(--bg-hover)}
    .btnDanger{border-color:rgba(239,68,68,.35);color:var(--danger)}
    .btnDanger:hover{background:var(--danger-soft);border-color:rgba(239,68,68,.5)}
    .btnSm{padding:5px 12px;font-size:12px;border-radius:8px}
    .btn svg{flex:none}

    /* Content View */
    #view{flex:1;overflow-y:auto;padding:24px;animation:viewFadeIn .2s ease-out}
@keyframes viewFadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    #view::-webkit-scrollbar{width:8px}

    /* ============================================================
       Cards (Level 3)
       ============================================================ */
    .card{
      background:var(--bg-card);
      border:1px solid var(--border);
      border-radius:var(--radius-lg);
      padding:18px 20px;
      transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease);
    }
    .card:hover{border-color:var(--border-2)}
    .cardTitle{
      font-size:13px;color:var(--text-secondary);font-weight:700;
      letter-spacing:.3px;margin-bottom:14px;
      display:flex;align-items:center;gap:8px;
    }
    .cardTitle .accentBar{
      width:3px;height:14px;border-radius:2px;
      background:var(--primary);
      flex:none;
    }
    .cardHeader{
      display:flex;align-items:center;justify-content:space-between;
      margin-bottom:16px;gap:12px;flex-wrap:wrap;
    }
    .cardHeader .title{font-size:14px;font-weight:700;color:var(--text-primary)}
    .cardHeader .subtitle{font-size:11.5px;color:var(--text-muted);margin-top:2px}

    /* ============================================================
       KPI Cards (Dashboard Row 1)
       ============================================================ */
    .kpiGrid{
      display:grid;
      grid-template-columns:repeat(7,1fr);
      gap:14px;
      margin-bottom:var(--gap-card);
    }
    .kpiCard{
      background:var(--bg-card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:16px 18px;
      transition:all var(--dur) var(--ease);
      position:relative;overflow:hidden;
    }
    .kpiCard:hover{border-color:var(--border-2);transform:translateY(-2px);box-shadow:var(--shadow)}
    .kpiCard.clickable{cursor:pointer}
    .kpiCard.clickable:hover{border-color:color-mix(in srgb,var(--c,var(--primary)) 40%,var(--border));transform:translateY(-2px);box-shadow:0 4px 20px color-mix(in srgb,var(--c,var(--primary)) 15%,transparent)}
    .kpiCard.clickable:active{transform:translateY(0)}
    .kpiCard .kpiIcon{
      width:34px;height:34px;border-radius:9px;
      display:flex;align-items:center;justify-content:center;
      margin-bottom:12px;
      color:var(--c,var(--primary));
      background:color-mix(in srgb,var(--c,var(--primary)) 12%,transparent);
    }
    .kpiCard .kpiLabel{font-size:11px;color:var(--text-muted);font-weight:600;letter-spacing:.3px;margin-bottom:4px}
    .kpiCard .kpiValue{
      font-size:26px;font-weight:800;color:var(--text-primary);
      letter-spacing:-.5px;line-height:1.1;
      font-variant-numeric:tabular-nums;
    }
    .kpiCard .kpiValue .unit{font-size:13px;font-weight:600;color:var(--text-muted);margin-left:2px}
    .kpiCard .kpiDelta{
      font-size:11px;margin-top:6px;
      display:flex;align-items:center;gap:4px;
      font-weight:600;
    }
    .kpiDelta.up{color:var(--success)}
    .kpiDelta.down{color:var(--danger)}
    .kpiDelta.neutral{color:var(--text-muted)}

    /* ============================================================
       Dashboard Grid Layout
       ============================================================ */
    .dashGrid{
      display:grid;
      grid-template-columns:repeat(12,1fr);
      gap:var(--gap-card);
    }
    .dashGrid .col-4{grid-column:span 4}
    .dashGrid .col-3{grid-column:span 3}
    .dashGrid .col-6{grid-column:span 6}
    .dashGrid .col-8{grid-column:span 8}
    .dashGrid .col-12{grid-column:span 12}
    .dashGrid .col-5{grid-column:span 5}
    .dashGrid .col-7{grid-column:span 7}

    /* ============================================================
       Radar Chart (能力六边形)
       ============================================================ */
    .radarWrap{display:flex;flex-direction:column;align-items:center}
    .radarSvg{width:100%;max-width:280px;height:auto}
    .radarLegend{
      display:flex;align-items:center;gap:16px;
      margin-top:14px;flex-wrap:wrap;justify-content:center;
    }
    .legendItem{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-secondary);font-weight:500}
    .legendDot{width:10px;height:10px;border-radius:3px;flex:none}
    .radarLabels{font-size:11px;font-weight:600;fill:var(--text-secondary)}
    .radarGridLine{stroke:var(--border-2);stroke-width:1;fill:none}
    .radarAxisLine{stroke:var(--border);stroke-width:1}
    .radarAreaCurrent{fill:var(--primary);fill-opacity:.18;stroke:var(--primary);stroke-width:2}
    .radarAreaRef{fill:var(--text-muted);fill-opacity:.06;stroke:var(--text-muted);stroke-width:1.5;stroke-dasharray:4 3}
    .radarPoint{fill:var(--primary);stroke:var(--bg-card);stroke-width:2}
    .radarValue{font-size:10px;font-weight:700;fill:var(--text-primary);font-variant-numeric:tabular-nums}

    /* ============================================================
       Trend Chart (SVG Line)
       ============================================================ */
    .trendChart{width:100%;height:160px}
    .trendSummary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;padding:12px 16px;background:var(--bg-input);border-radius:10px}
    .trendSumItem{display:flex;flex-direction:column;gap:4px}
    .trendSumLabel{font-size:11px;color:var(--text-muted);font-weight:500}
    .trendSumValue{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
    .trendSumValue .unit{font-size:12px;font-weight:500;color:var(--text-muted);margin-left:2px}
    @media(max-width:640px){.trendSummary{grid-template-columns:repeat(2,1fr)}}
    .trendGridLine{stroke:var(--border);stroke-width:1;stroke-dasharray:3 4}
    .trendLine{fill:none;stroke:var(--primary);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .trendArea{opacity:1}
    .trendPoint{fill:var(--primary);stroke:var(--bg-card);stroke-width:2}
    .trendPoint.pbPoint{fill:#10B981;stroke:var(--bg-card);stroke-width:2.5}
    .trendPointGroup:hover .trendPoint{r:5}
    .trendLabel{font-size:10px;fill:var(--text-muted);font-weight:500}
    .trendValueLabel{font-size:10px;fill:var(--text-secondary);font-weight:600;font-variant-numeric:tabular-nums}

    .trendHeader{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
    .trendHeader .trendBig{
      font-size:28px;font-weight:800;color:var(--text-primary);
      letter-spacing:-.5px;font-variant-numeric:tabular-nums;
    }
    .trendHeader .trendUnit{font-size:13px;color:var(--text-muted);font-weight:600}
    .trendHeader .trendDelta{font-size:12px;font-weight:700;margin-left:auto}

    /* ============================================================
       Today's Attention List
       ============================================================ */
    .attentionGroup{margin-bottom:16px}
    .attentionGroup:last-child{margin-bottom:0}
    .attentionGroupTitle{
      display:flex;align-items:center;gap:7px;
      font-size:11.5px;font-weight:700;
      margin-bottom:8px;letter-spacing:.3px;
    }
    .attentionGroupTitle .count{
      font-size:10px;padding:1px 7px;border-radius:999px;
      background:var(--bg-elevated);color:var(--text-muted);font-weight:700;
    }
    .attentionItem{
      display:flex;align-items:center;gap:10px;
      padding:9px 10px;border-radius:10px;
      transition:background var(--dur-fast) var(--ease);
      cursor:pointer;
    }
    .attentionItem:hover{background:var(--bg-hover)}
    .attentionGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .attentionCard{padding:10px 12px;border-radius:8px;cursor:pointer;transition:all .15s;border:1px solid transparent;background:var(--bg-input)}
    .attentionCard:hover{background:var(--bg-hover);border-color:var(--border);transform:translateY(-1px)}
    .attentionCardTop{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
    .attentionCardName{font-weight:700;font-size:13px}
    .attentionCardEvent{font-size:11px;color:var(--text-muted);margin-bottom:2px}
    .attentionCardReason{font-size:11px;color:var(--text-secondary);font-weight:500}
    @media(max-width:768px){.attentionGrid{grid-template-columns:1fr}}
    .riskStats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
    .riskStat{display:flex;align-items:center;gap:7px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg-input);font-size:12px;color:var(--text-secondary)}
    .riskStat b{font-size:16px;font-weight:700;color:var(--c,var(--text));margin-left:auto;font-variant-numeric:tabular-nums}
    .riskDot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--text-muted));flex:none}
    .goodSummary{display:flex;align-items:center;gap:8px;padding:8px 0;font-size:12.5px;color:var(--text-secondary)}
    @media(max-width:640px){.riskStats{grid-template-columns:1fr 1fr}}
    .attentionAvatar{
      width:32px;height:32px;border-radius:50%;flex:none;
      display:flex;align-items:center;justify-content:center;
      font-size:12px;font-weight:700;color:#fff;
      background:var(--c,var(--primary));
    }
    .attentionInfo{flex:1;min-width:0}
    .attentionName{font-size:12.5px;font-weight:700;color:var(--text-primary)}
    .attentionDetail{font-size:11px;color:var(--text-muted);margin-top:1px}
    .attentionBadge{
      font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;
      flex:none;white-space:nowrap;
    }

    /* ============================================================
       Performance Table (近期成绩)
       ============================================================ */
    .perfTable{width:100%;border-collapse:collapse}
    .perfTable th{
      font-size:10.5px;color:var(--text-muted);font-weight:700;
      text-align:left;padding:8px 10px;
      border-bottom:1px solid var(--border);
      letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;
    }
    .perfTable td{
      padding:10px;font-size:12.5px;color:var(--text-primary);
      border-bottom:1px solid var(--border);vertical-align:middle;
    }
    .perfTable tbody tr:last-child td{border-bottom:none}
    .perfTable tbody tr{transition:background var(--dur-fast) var(--ease)}
    .perfTable tbody tr:hover{background:var(--bg-hover)}
    .perfTable .numCell{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
    .perfTable .textCell{text-align:left}
    .perfTable .athleteCell{display:flex;align-items:center;gap:9px}

    /* ============================================================
       Load Distribution (训练负荷分布)
       ============================================================ */
    .donutWrap{display:flex;align-items:center;gap:24px}
    .donutSvg{width:160px;height:160px;flex:none}
    .donutCenter{
      position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      text-align:center;
    }
    .donutLegend{flex:1;display:flex;flex-direction:column;gap:10px}
    .donutLegendItem{display:flex;align-items:center;gap:10px;font-size:12px}
    .donutLegendItem .dot{width:10px;height:10px;border-radius:3px;flex:none}
    .donutLegendItem .label{flex:1;color:var(--text-secondary);font-weight:500}
    .donutLegendItem .count{color:var(--text-muted);font-size:11px;font-weight:600}
    .donutLegendItem .pct{color:var(--text-primary);font-weight:700;font-size:12px;font-variant-numeric:tabular-nums;width:36px;text-align:right}

    /* ============================================================
       Plan Completion (计划完成情况)
       ============================================================ */
    .weekRow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
    .weekDay{
      text-align:center;padding:8px 4px;border-radius:8px;
      font-size:11px;font-weight:600;
      background:var(--bg-card-2);border:1px solid var(--border);
      color:var(--text-muted);
    }
    .weekDay.today{
      background:var(--primary-soft);border-color:var(--border-primary);
      color:var(--primary);font-weight:700;
    }
    .weekDay .dNum{font-size:14px;font-weight:700;display:block;margin-bottom:2px;color:var(--text-secondary)}
    .weekDay.today .dNum{color:var(--primary)}

    .progBar{
      height:8px;border-radius:4px;
      background:var(--bg-elevated);overflow:hidden;
      margin:8px 0;
    }
    .progBar>div{
      height:100%;border-radius:4px;
      background:var(--primary);
      transition:width .4s var(--ease);
    }
    .progBar.ok>div{background:var(--success)}

    /* ============================================================
       Badge / Tag System (统一)
       ============================================================ */
    .badge{
      display:inline-flex;align-items:center;gap:5px;
      padding:3px 10px;border-radius:999px;
      font-size:11px;font-weight:700;letter-spacing:.2px;
      white-space:nowrap;line-height:1.4;
    }
    .badge::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;flex:none;opacity:.8}
    .badge.normal{background:var(--primary-soft);color:var(--primary)}
    .badge.good{background:var(--success-soft);color:var(--success)}
    .badge.warning{background:var(--warning-soft);color:var(--warning)}
    .badge.danger{background:var(--danger-soft);color:var(--danger)}
    .badge.muted{background:var(--bg-elevated);color:var(--text-muted)}
    .badge.info{background:var(--cyan-soft);color:var(--cyan)}
    .badge.purple{background:var(--purple-soft);color:var(--purple)}
    .badge.plainDot::before{display:none}

    .tag{
      display:inline-flex;align-items:center;gap:5px;
      padding:2px 9px;border-radius:6px;
      font-size:11px;font-weight:600;
      color:var(--c,#8b96a5);
      background:color-mix(in srgb,var(--c,#8b96a5) 12%,transparent);
      border:1px solid color-mix(in srgb,var(--c,#8b96a5) 25%,transparent);
      white-space:nowrap;
    }
    .tag.ok{--c:var(--success)}
    .tag.warn{--c:var(--warning)}
    .tag.bad{--c:var(--danger)}
    .tag.acc{--c:var(--primary)}
    .tag.purple{--c:var(--purple)}
    .tag.orange{--c:#F59E0B}
    .tag.green{--c:var(--success)}
    .tag.pink{--c:#F43F5E}
    .tag.plain{--c:var(--text-muted)}

    /* ============================================================
       Avatar
       ============================================================ */
    .avatar{
      width:30px;height:30px;border-radius:50%;flex:none;
      display:inline-flex;align-items:center;justify-content:center;
      font-size:12px;font-weight:700;color:#fff;
      background:var(--c,var(--primary));
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
    }
    .avatar.lg{width:44px;height:44px;font-size:16px;border-radius:12px}
    .avatar.xl{width:56px;height:56px;font-size:20px;border-radius:14px}

    /* ============================================================
       Data Table (运动员列表 - SaaS Style)
       ============================================================ */
    .tableWrap{
      overflow-x:auto;
      border:1px solid var(--border);
      border-radius:var(--radius);
      background:var(--bg-card);
    }
    table.tbl{width:100%;border-collapse:collapse;min-width:760px}
    .tbl th{
      font-size:10.5px;color:var(--text-muted);font-weight:700;
      text-align:left;padding:11px 14px;
      border-bottom:1px solid var(--border);
      letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;
      background:var(--bg-card-2);
    }
    .tbl td{
      padding:11px 14px;border-bottom:1px solid var(--border);
      font-size:12.5px;color:var(--text-primary);
      white-space:nowrap;vertical-align:middle;
    }
    .tbl tbody tr:last-child td{border-bottom:none}
    .tbl tbody tr{transition:background var(--dur-fast) var(--ease)}
    .tbl tbody tr:hover{background:var(--bg-hover)}
    .tbl .sub{font-size:11px;color:var(--text-muted)}
    .tbl .numCell{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
    .rowActs{display:inline-flex;gap:4px;opacity:0;transition:opacity var(--dur-fast) var(--ease)}
    tr:hover .rowActs{opacity:1}
    .rowIconBtn{
      width:28px;height:28px;border-radius:7px;border:none;background:none;
      color:var(--text-muted);cursor:pointer;
      display:inline-flex;align-items:center;justify-content:center;
      transition:all var(--dur-fast) var(--ease);
    }
    .rowIconBtn:hover{background:var(--bg-elevated);color:var(--text-primary)}
    .rowIconBtn.danger:hover{background:var(--danger-soft);color:var(--danger)}

    /* ============================================================
       Form Elements
       ============================================================ */
    .formGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
    .field label{
      display:block;font-size:11px;color:var(--text-muted);
      margin-bottom:6px;font-weight:700;letter-spacing:.3px;
    }
    .field .req{color:var(--danger)}
    .inp,textarea.inp,select.inp{
      width:100%;padding:9px 12px;border-radius:9px;
      border:1px solid var(--border);background:var(--bg-input);
      color:var(--text-primary);font-size:12.5px;outline:none;
      transition:all var(--dur-fast) var(--ease);font-family:inherit;
    }
    .inp:focus,textarea.inp:focus,select.inp:focus{
      border-color:var(--primary);
      box-shadow:0 0 0 3px var(--primary-soft);
    }
    textarea.inp{resize:vertical;min-height:60px;line-height:1.5}
    select.inp{cursor:pointer}
    .inp::placeholder{color:var(--text-faint)}

    /* Wellness Sliders */
    .wellGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:12px}
    .wellBlock{
      border:1px solid var(--border);border-radius:var(--radius);
      padding:14px 16px;background:var(--bg-card-2);
    }
    .wellBlockTitle{
      font-size:12px;font-weight:700;color:var(--text-primary);
      margin-bottom:12px;display:flex;align-items:center;gap:7px;
    }
    .wellRangeRow{display:flex;align-items:center;gap:12px}
    .wellRange{
      flex:1;-webkit-appearance:none;appearance:none;
      height:6px;border-radius:3px;background:var(--bg-elevated);
      outline:none;cursor:pointer;
    }
    .wellRange::-webkit-slider-thumb{
      -webkit-appearance:none;appearance:none;
      width:20px;height:20px;border-radius:50%;
      background:var(--primary);cursor:pointer;
      box-shadow:0 2px 8px rgba(59,130,246,.4);
      border:2px solid var(--bg-card);
    }
    .wellRangeVal{
      flex:none;width:32px;text-align:center;
      font-weight:800;font-size:17px;color:var(--primary);
      font-variant-numeric:tabular-nums;
    }
    .wellDef{display:block;font-size:10px;color:var(--text-muted);line-height:1.5;margin:6px 0 0;opacity:.85}

    /* Strength Bars */
    .sbar{display:flex;align-items:center;gap:12px;margin-top:8px}
    .sbar .lbl{width:60px;flex:none;font-size:11.5px;color:var(--text-muted);font-weight:600}
    .sbar .track{flex:1;height:6px;border-radius:3px;background:var(--bg-elevated);overflow:hidden}
    .sbar .fill{
      height:100%;border-radius:3px;
      background:var(--primary);
      transition:width .4s var(--ease);
    }
    .sbar .v{
      width:64px;flex:none;text-align:right;
      font-size:12px;color:var(--text-secondary);
      font-variant-numeric:tabular-nums;font-weight:700;
    }

    /* Chip */
    .chip{
      display:inline-flex;align-items:center;gap:7px;
      padding:6px 13px;border-radius:999px;
      border:1px solid var(--border);
      font-size:12px;color:var(--text-secondary);
      background:var(--bg-card);cursor:pointer;
      transition:all var(--dur-fast) var(--ease);
      font-weight:500;
    }
    .chip:hover{border-color:var(--border-2);color:var(--text-primary);background:var(--bg-hover)}
    .chip.on{
      background:var(--primary-soft);border-color:var(--border-primary);
      color:var(--primary);font-weight:700;
    }
    .chip .x{
      color:var(--text-muted);font-size:13px;line-height:1;
      background:none;border:none;cursor:pointer;padding:0;
    }
    .chip .x:hover{color:var(--danger)}
    .chipRow{display:flex;flex-wrap:wrap;gap:7px}

    /* KV Row */
    .kvRow{
      display:flex;justify-content:space-between;gap:12px;
      padding:8px 0;font-size:12.5px;
      border-bottom:1px solid var(--border);
    }
    .kvRow:last-child{border-bottom:none}
    .kvRow .k{color:var(--text-muted);font-weight:500}
    .kvRow .v{color:var(--text-primary);text-align:right;font-weight:600;font-variant-numeric:tabular-nums}

    /* ============================================================
       Modal / Overlay
       ============================================================ */
    .overlay{
      position:fixed;inset:0;
      background:var(--overlay);backdrop-filter:blur(6px);
      display:flex;align-items:center;justify-content:center;
      z-index:100;animation:fadeIn var(--dur) var(--ease);
    }
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .modal{
      width:min(560px,94vw);max-height:86vh;overflow:auto;
      border-radius:var(--radius-lg);
      border:1px solid var(--border-2);
      background:var(--bg-sidebar);
      box-shadow:var(--shadow-lg);
      padding:22px 24px;
      animation:modalPop .2s var(--ease);
    }
    @keyframes modalPop{from{transform:scale(.96) translateY(8px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
    .modalTitle{font-size:16px;font-weight:800;margin-bottom:4px;color:var(--text-primary)}
    .modalSub{font-size:12px;color:var(--text-muted);margin-bottom:18px;line-height:1.5}
    .modalFooter{
      display:flex;align-items:center;justify-content:flex-end;
      gap:10px;margin-top:20px;padding-top:16px;
      border-top:1px solid var(--border);
    }

    /* ============================================================
       Toast System
       ============================================================ */
    #toastContainer{
      position:fixed;top:20px;right:20px;z-index:9999;
      display:flex;flex-direction:column;gap:10px;
      pointer-events:none;
    }
    .toast{
      display:flex;align-items:center;gap:10px;
      padding:12px 18px;border-radius:12px;
      background:var(--bg-sidebar);border:1px solid var(--border-2);
      box-shadow:var(--shadow-lg);
      font-size:13px;font-weight:600;color:var(--text-primary);
      pointer-events:auto;
      animation:toastIn .25s var(--ease);
      min-width:240px;max-width:380px;
    }
    .toast.out{animation:toastOut .25s var(--ease) forwards}
    @keyframes toastIn{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}
    @keyframes toastOut{from{transform:translateX(0);opacity:1}to{transform:translateX(30px);opacity:0}}
    .toast .toastIcon{
      width:22px;height:22px;border-radius:6px;flex:none;
      display:flex;align-items:center;justify-content:center;
    }
    .toast.success .toastIcon{background:var(--success-soft);color:var(--success)}
    .toast.error .toastIcon{background:var(--danger-soft);color:var(--danger)}
    .toast.info .toastIcon{background:var(--primary-soft);color:var(--primary)}
    .toast.warning .toastIcon{background:var(--warning-soft);color:var(--warning)}

    /* ============================================================
       Empty State
       ============================================================ */
    .empty{
      display:flex;flex-direction:column;align-items:center;gap:10px;
      padding:40px 20px;color:var(--text-muted);font-size:13px;
      text-align:center;
    }
    .empty .emptyIcon{
      width:52px;height:52px;border-radius:14px;
      display:flex;align-items:center;justify-content:center;
      background:var(--bg-elevated);color:var(--text-faint);
      margin-bottom:4px;
    }
    .empty .emptyTitle{font-size:14px;font-weight:700;color:var(--text-secondary)}
    .empty .emptyDesc{font-size:12px;color:var(--text-muted);max-width:280px;line-height:1.5}

    /* ============================================================
       Plan Calendar Cells
       ============================================================ */
    .planTable{min-width:940px}
    .planTable .weekLbl{font-weight:700;color:var(--text-secondary);white-space:nowrap;font-size:12px}
    .cell{
      position:relative;display:block;width:100%;min-width:130px;
      padding:9px 10px;text-align:left;border-radius:10px;
      border:1px solid var(--border);background:var(--bg-card-2);
      color:var(--text-primary);font-size:11.5px;line-height:1.55;
      cursor:pointer;transition:all var(--dur-fast) var(--ease);
      font-family:inherit;white-space:normal;min-height:56px;
    }
    .cell:hover{border-color:var(--primary);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
    .cell.done{
      background:var(--success-soft);
      border-color:rgba(16,185,129,.25);
      color:var(--text-secondary);
    }
    .cell.done .cellText{text-decoration:line-through;text-decoration-color:rgba(16,185,129,.5)}
    .cell.rest{background:var(--bg-card);border-color:var(--border);color:var(--text-faint)}
    .cell.keyDay{border-color:var(--border-primary);background:var(--primary-soft)}
    .cell .ph{color:var(--text-faint)}
    .cell .doneMark{
      position:absolute;top:6px;right:8px;
      width:16px;height:16px;border-radius:50%;
      background:var(--success);color:#fff;
      display:flex;align-items:center;justify-content:center;
      font-size:9px;font-weight:800;
    }
    .phaseInp{
      width:100px;padding:6px 10px;border-radius:8px;
      border:1px solid var(--border);background:var(--bg-input);
      color:var(--text-primary);font-size:11.5px;outline:none;
      font-family:inherit;font-weight:600;
    }
    .phaseInp:focus{border-color:var(--primary)}

    /* ============================================================
       Athlete Detail Profile
       ============================================================ */
    .profileHeader{
      display:flex;align-items:center;gap:18px;
      padding:20px 22px;margin-bottom:var(--gap-card);
      background:var(--bg-card);border:1px solid var(--border);
      border-radius:var(--radius-lg);
    }
    .profileInfo{flex:1;min-width:0}
    .profileName{font-size:22px;font-weight:800;color:var(--text-primary);letter-spacing:-.3px}
    .profileMeta{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
    .profileStats{display:flex;gap:24px;margin-top:12px;flex-wrap:wrap}
    .profileStat .psLabel{font-size:10.5px;color:var(--text-muted);font-weight:700;letter-spacing:.5px;text-transform:uppercase}
    .profileStat .psValue{font-size:18px;font-weight:800;color:var(--text-primary);font-variant-numeric:tabular-nums;margin-top:2px}

    /* ============================================================
       Result Highlight Card (成绩数字视觉重点)
       ============================================================ */
    .resultHighlight{
      display:flex;align-items:center;gap:20px;
      padding:16px 20px;margin-bottom:14px;
      background:var(--bg-card-2);border:1px solid var(--border);
      border-radius:var(--radius);
    }
    .resultBigNum{
      font-size:36px;font-weight:800;color:var(--text-primary);
      letter-spacing:-1px;font-variant-numeric:tabular-nums;
      line-height:1;
    }
    .resultBigNum .unit{font-size:16px;color:var(--text-muted);font-weight:600;margin-left:4px}
    .resultInfo{flex:1}
    .resultItemName{font-size:14px;font-weight:700;color:var(--text-primary)}
    .resultMetaRow{display:flex;align-items:center;gap:12px;margin-top:6px;flex-wrap:wrap}

    /* Utility */
    .hint{font-size:11.5px;color:var(--text-muted);line-height:1.6}
    .mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
    .mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb20{margin-bottom:20px}
    .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .hide{display:none!important}
    .textRight{text-align:right}
    .flexBetween{display:flex;align-items:center;justify-content:space-between}

    /* Footer disclaimer */
    .dashFooter{
      text-align:center;padding:20px 0 8px;
      font-size:11px;color:var(--text-faint);
      letter-spacing:.3px;
    }

    /* ============================================================
       Responsive
       ============================================================ */
    @media (max-width:1400px){
      .kpiGrid{grid-template-columns:repeat(4,1fr)}
    }
    @media (max-width:1100px){
      .kpiGrid{grid-template-columns:repeat(3,1fr)}
      .dashGrid .col-4{grid-column:span 6}
      .dashGrid .col-3{grid-column:span 6}
      .dashGrid .col-5{grid-column:span 6}
      .dashGrid .col-7{grid-column:span 6}
    }
    @media (max-width:820px){
      #app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
      .sidebar{
        flex-direction:row;border-right:none;border-bottom:1px solid var(--border);
        overflow-x:auto;align-items:center;flex-wrap:nowrap;
        padding:10px 12px;
      }
      .logo{border-bottom:none;margin-bottom:0;padding:0 8px}
      .nav .n{display:none}
      .nav{width:auto;justify-content:center;padding:9px 12px}
      .nav .cnt{display:none}
      .nav.on::before{display:none}
      .sideFoot{flex-direction:row;margin-top:0;border-top:none;padding-top:0;flex-wrap:nowrap}
      .coachProfile{display:none}
      .nav-section{display:none}
      .searchWrap{width:auto;flex:1;min-width:140px}
      .topSub{display:none}
      .headerDate{display:none}
      .kpiGrid{grid-template-columns:repeat(2,1fr)}
      .dashGrid .col-4,.dashGrid .col-3,.dashGrid .col-6,.dashGrid .col-8,.dashGrid .col-5,.dashGrid .col-7{grid-column:span 12}
      #view{padding:16px}
      .cell{min-width:104px}
      .formGrid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
    }
    @media (max-width:560px){
      .topTitle{font-size:15px}
      .topbar{padding:10px 14px;gap:8px}
      #view{padding:12px 12px 24px}
      .modal{padding:16px}
      .kpiGrid{grid-template-columns:1fr 1fr}
      .kpiCard .kpiValue{font-size:22px}
    }

    /* ===== 手机竖屏底部导航 ===== */
    .bottomNav{display:none}
    .moreMask{display:none;position:fixed;inset:0;z-index:84;background:rgba(0,0,0,.45)}
    .moreMask.show{display:block}
    .moreMenu{display:none;position:fixed;left:12px;right:12px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:85;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
    .moreMenu.show{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
    .moreItem{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border:none;background:none;color:var(--text-secondary);font-size:11px;cursor:pointer;border-radius:10px}
    .moreItem:hover{background:var(--bg-hover);color:var(--text)}
    @media (max-width:640px){
      .bottomNav{
        display:flex;position:fixed;left:0;right:0;bottom:0;z-index:80;

<body>

  <script>
  (function () {
    'use strict';
    /* ================= 常量 / 状态 ================= */
    var LS_KEY = 'sportsdb_v1';
    var APP_VERSION = '3.0.0';
    var UPDATE_JSON = 'https://zhangoko.github.io/sports-db/version.json';
    var DAYS = ['周一','周二','周三','周四','周五','周六','周日'];
    var DEF_ITEMS = ['30米','60米','100米','110米','150米','200米','300米'];
    var CYCLE_MODELS = {
      macro: { label:'大周期 12周', weeks:12 },
      meso:  { label:'中周期 8周',  weeks:8 },
      pre:   { label:'赛前周期 4周', weeks:4 },
      trans: { label:'过渡期 2周',  weeks:2 }
    };
    var PHASE_NAMES = { GP:'一般准备期', SP:'专项准备期', PRE:'赛前期', COMP:'比赛期', TR:'过渡期' };
    var MONTH_PHASES = [
      { key:'GP',   label:'一般准备期' },
      { key:'SP',   label:'专项准备期' },
      { key:'PRE',  label:'赛前期' },
      { key:'COMP', label:'比赛期' },
      { key:'TR',   label:'过渡期' }
    ];

    /* ================= Toast 系统 ================= */
    function toast(msg, type, onClick) {
      type = type || 'success';
      var container = document.getElementById('toastContainer');
      if (!container) { alert(msg); return; }
      var icons = {
        success: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg>',
        error:   '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
        info:    '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>',
        warning: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg>'
      };
      var el = document.createElement('div');
      el.className = 'toast ' + type;
      el.innerHTML = '<span class="toastIcon">' + (icons[type] || icons.info) + '</span><span>' + msg + '</span>';
      if (onClick) {
        el.style.cursor = 'pointer';
        el.addEventListener('click', function () { onClick(); });
      }
      container.appendChild(el);
      setTimeout(function () {
        el.classList.add('out');
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 260);
      }, 2600);
    }

    function phaseSeq(N) {
      var cuts = [0.3,0.6,0.85,1.0], keys = ['GP','SP','PRE','COMP'];
      var seq = [], prev = 0;
      for (var i = 0; i < 4; i++) {
        var end = Math.min(N, Math.max(prev + 1, Math.round(N * cuts[i])));
        if (end > prev) seq.push([prev, end, keys[i]]);
        prev = end;
      }
      return seq;
    }
    function seqFor(modelKey) {
      if (modelKey === 'trans') return [[0,2,'TR']];
      if (modelKey === 'pre') return [[0,1,'SP'],[1,3,'PRE'],[3,4,'COMP']];
      if (modelKey === 'meso') return phaseSeq(8);
      return phaseSeq(12);
    }
    function disciplineOf(a) {
      var ev = ((a && a.event) || '').toLowerCase();
      if (/(栏|hurdle)/.test(ev)) return 'hurdle';
      if (/(长跑|800|1500|3000|5000|10000|马拉松|marathon)/.test(ev)) return 'distance';
      if (/(跳|jump)/.test(ev)) return 'jump';
      if (/(短跑|100|200|400|sprint)/.test(ev)) return 'sprint';
      return 'unknown';
    }
    function colorOf(ev) {
      var e = (ev || '').toLowerCase();
      if (/(栏|hurdle)/.test(e)) return '#2563EB';
      if (/(长跑|800|1500|3000|5000|10000|马拉松)/.test(e)) return '#F59E0B';
      if (/(跳|jump)/.test(e)) return '#10B981';
      if (/(投|throw)/.test(e)) return '#F43F5E';
      if (/(短跑|100|200|400|短)/.test(e)) return '#3B82F6';
      return '#64748B';
    }

    function defaults() {
      return { athletes:[], items:DEF_ITEMS.slice(), month:{}, cycle:{}, results:{}, cycleStart:{}, ui:{}, wellness:{}, eventConfigs:{} };
    }

    /* ============================================================
       数据访问层（DataAdapter）
       - 当前实现：LocalStorage Adapter
       - 未来接后端：将 load/save 替换为 fetch('/api/...') 即可，
         所有页面通过 Store 读写，业务逻辑无需改动
       ============================================================ */
    var Store = {
      KEY: LS_KEY,
      load: function () {
        try {
          var raw = localStorage.getItem(this.KEY);
          return raw ? Object.assign(defaults(), JSON.parse(raw)) : defaults();
        } catch (e) { return defaults(); }
      },
      save: function (db) {
        try { localStorage.setItem(this.KEY, JSON.stringify(db)); return true; }
        catch (e) { return false; }
      }
      /* 未来 API Adapter 示例：
      load: async function () { return fetch('/api/data').then(r => r.json()); },
      save: async function (db) { return fetch('/api/data', { method:'POST', body: JSON.stringify(db) }); }
      */
    };

    /* ============================================================
       认证抽象（AuthService）
       - 当前：本地单教练模式（无登录）
       - 未来：接入后端登录后返回真实 User（USR-xxxx）
       ============================================================ */
    var AuthService = {
      getCurrentUser: function () {
        return { id: 'USR-LOCAL-COACH', name: 'Coach', role: 'coach' };
      },
      isAuthenticated: function () { return true; }
    };

    /* ============================================================
       权限抽象（PermissionService）
       - 当前：单教练全权限
       - 未来：按 CoachAthleteRelationship 校验（前端隐藏≠安全，
         服务端必须二次校验）
       ============================================================ */
    var PermissionService = {
      canAccessAthlete: function (athleteId) { return true; },   /* 未来查 Relationship */
      canEditAthlete: function (athleteId) { return true; },
      canViewResults: function (athleteId) { return true; },
      canSubmitWellness: function (athleteId) { return true; }
    };

    function normalizeDB(input) {
      var source = input && typeof input === 'object' ? input : {};
      var normalized = defaults();
      normalized.athletes = Array.isArray(source.athletes) ? source.athletes.filter(function (a) { return a && typeof a === 'object' && a.id; }) : [];
      normalized.items = Array.isArray(source.items) ? source.items.filter(function (x) { return typeof x === 'string' && x.trim(); }) : DEF_ITEMS.slice();
      normalized.month = source.month && typeof source.month === 'object' && !Array.isArray(source.month) ? source.month : {};
      normalized.cycle = source.cycle && typeof source.cycle === 'object' && !Array.isArray(source.cycle) ? source.cycle : {};
      normalized.results = source.results && typeof source.results === 'object' && !Array.isArray(source.results) ? source.results : {};
      normalized.cycleStart = source.cycleStart && typeof source.cycleStart === 'object' && !Array.isArray(source.cycleStart) ? source.cycleStart : {};
      normalized.ui = source.ui && typeof source.ui === 'object' && !Array.isArray(source.ui) ? source.ui : {};
      normalized.wellness = source.wellness && typeof source.wellness === 'object' && !Array.isArray(source.wellness) ? source.wellness : {};
      normalized.eventConfigs = source.eventConfigs && typeof source.eventConfigs === 'object' && !Array.isArray(source.eventConfigs) ? source.eventConfigs : {};
      for (var i = 0; i < normalized.athletes.length; i++) {
        var athlete = normalized.athletes[i];
        if (!athlete.strength || typeof athlete.strength !== 'object') athlete.strength = {};
        if (!Array.isArray(athlete.items)) athlete.items = [];
        if (!Array.isArray(normalized.results[athlete.id])) normalized.results[athlete.id] = [];
        if (!Array.isArray(normalized.wellness[athlete.id])) normalized.wellness[athlete.id] = [];
      }
      return normalized;
    }
    var DB = normalizeDB(Store.load());
    var storageOk = true;
    function save() {
      storageOk = Store.save(DB);
    }
    function applyTheme() {
      var th = (DB.ui && DB.ui.theme === 'light') ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', th);
      var sw = document.getElementById('themeSwitch');
      if (sw) sw.classList.toggle('on', th === 'dark');
      var lbl = document.getElementById('themeLabel');
      if (lbl) lbl.textContent = th === 'dark' ? '深色模式' : '浅色模式';
    }
    function checkUpdate() {
      if (UPDATE_JSON.indexOf('你的用户名') >= 0) return;
      fetch(UPDATE_JSON + '?t=' + Date.now(), { cache:'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (m) {
          if (m && m.version && m.version !== APP_VERSION && m.html) {
            var tried = null;
            try { tried = sessionStorage.getItem('cw_tried_version'); } catch (e) {}
            if (tried === m.version) return; /* 本会话已尝试更新到此版本，避免无限刷新 */
            try { sessionStorage.setItem('cw_tried_version', m.version); } catch (e) {}
            toast('正在更新到最新版 ' + m.version + ' …', 'info');
            setTimeout(function () { location.href = m.html + '?v=' + m.version; }, 400);
          }
        })
        .catch(function () {}); /* 检查失败：忽略，继续用当前版本 */
    }
    function autoBackup(prefix) {
      try {
        var blob = new Blob([JSON.stringify(DB, null, 2)], { type:'application/json' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        var d = new Date(), p2 = function (x) { return String(x).padStart(2,'0'); };
        a.download = prefix + '-' + d.getFullYear() + p2(d.getMonth()+1) + p2(d.getDate()) + '-' + p2(d.getHours()) + p2(d.getMinutes()) + p2(d.getSeconds()) + '.json';
        a.click();
        URL.revokeObjectURL(a.href);
      } catch (e) {}
    }

    var S = { tab:'overview', editId:null, sel:null, cell:null, q:'', monthPhase:'GP', cycleModel:'macro', planMode:'cscs', recItem:null, recFilter:'all', recEditId:null, recCustom:'', recDate:'', cmpMode:'hist', wellTrend:7, wellnessFilter:'all', athleteEventFilter:'all', athleteStatusFilter:'all', statusModeAid:null, teamListSession:null };

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) {
        return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m];
      });
    }
    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
    function todayStr() {
      var d = new Date();
      var p = function (x) { return String(x).padStart(2,'0'); };
      return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
    }
    function dateAgo(days) {
      var d = new Date(todayStr() + 'T00:00:00');
      d.setDate(d.getDate() - days);
      var p = function (x) { return String(x).padStart(2,'0'); };
      return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
    }
    function generateTestData30() {
      autoBackup('Coach Work-生成测试数据前自动备份');
      if (!confirm('将在现有数据后追加 30 名测试运动员，不会覆盖已有数据。是否继续？')) return;
      var stamp = Date.now().toString(36);
      for (var i = 0; i < 30; i++) {

    /* 取某阶段 4 周模板（按项目覆盖；mode=level3 用田径专项模板） */
    function phaseWeeks(phase, disc, mode) {
      var weeks = (mode === 'level3' ? TPL_L3[phase] : TPL[phase]) || TPL[phase];
      var ov = (TPL_DISC[disc] && TPL_DISC[disc][phase]) || null;
      if (!ov) return weeks;
      var out = [];
      for (var k = 0; k < 4; k++) {
        var wk = weeks[k].slice();
        for (var d in ov) {
          if (!ov.hasOwnProperty(d)) continue;
          var dd = ov[d];
          wk[+d] = Array.isArray(dd) ? (dd[k] != null ? dd[k] : dd[0]) : dd;
        }
        out.push(wk);
      }
      return out;
    }
    function genMonth(phaseKey) {
      var plan = ensurePlan('month', S.sel);
      var weeks = phaseWeeks(phaseKey, disciplineOf(getAthlete(S.sel)), S.planMode);
      for (var w = 0; w < 4; w++) {
        plan.rows[w] = weeks[w].map(function (t) { return { t:t, done:false }; });
      }
      save();
      toast('月计划已生成：' + PHASE_NAMES[phaseKey], 'success');
    }
    function genCycle(modelKey) {
      var plan = ensurePlan('cycle', S.sel);
      var N = CYCLE_MODELS[modelKey].weeks;
      var seq = seqFor(modelKey);
      var disc = disciplineOf(getAthlete(S.sel));
      plan.weeks = N;
      plan.phases = [];
      plan.rows = [];
      for (var w = 0; w < N; w++) {
        var key = 'TR';
        for (var s = 0; s < seq.length; s++) {
          if (w >= seq[s][0] && w < seq[s][1]) { key = seq[s][2]; break; }
        }
        plan.phases.push(PHASE_NAMES[key]);
        var wk = phaseWeeks(key, disc, S.planMode)[w % 4];
        plan.rows.push(wk.map(function (t) { return { t:t, done:false }; }));
      }
      DB.cycleStart[S.sel] = todayStr();
      save();
      toast('周期计划已生成：' + CYCLE_MODELS[modelKey].label, 'success');
    }


    /* ================= SVG 趋势折线图 ================= */
    function renderTrendChart(dataPoints, color, unit, height, opts) {
      height = height || 160;
      opts = opts || {};
      if (!dataPoints || !dataPoints.length) {
        return '<div class="empty" style="padding:24px"><div class="emptyIcon" style="width:40px;height:40px">' + ico('chart') + '</div><div class="emptyTitle">暂无趋势数据</div><div class="emptyDesc">每个数据点代表一次实际成绩记录</div></div>';
      }
      var w = 480, h = height, pad = { top:20, right:20, bottom:28, left:44 };
      var cw = w - pad.left - pad.right, ch = h - pad.top - pad.bottom;
      var vals = dataPoints.map(function(d){return d.value;});
      var minV = Math.min.apply(null, vals), maxV = Math.max.apply(null, vals);
      /* PB参考线纳入Y轴范围 */
      if (opts.pbValue != null && opts.pbValue > 0) {
        minV = Math.min(minV, opts.pbValue);
        maxV = Math.max(maxV, opts.pbValue);
      }
      if (minV === maxV) { minV -= 1; maxV += 1; }
      var range = maxV - minV;
      minV -= range * 0.12; maxV += range * 0.12;

      function xPos(i) { return pad.left + (dataPoints.length <= 1 ? cw/2 : (i / (dataPoints.length - 1)) * cw); }
      function yPos(v) { return pad.top + ch - ((v - minV) / (maxV - minV)) * ch; }

      /* 网格线 */
      var grid = '';
      for (var g = 0; g <= 4; g++) {
        var gy = pad.top + (g / 4) * ch;
        var gv = maxV - (g / 4) * (maxV - minV);
        grid += '<line class="trendGridLine" x1="' + pad.left + '" y1="' + gy.toFixed(1) + '" x2="' + (w - pad.right) + '" y2="' + gy.toFixed(1) + '"/>';
        grid += '<text class="trendLabel" x="' + (pad.left - 6) + '" y="' + (gy + 3).toFixed(1) + '" text-anchor="end">' + gv.toFixed(2) + '</text>';
      }
      /* Y轴单位标签 */
      var yUnitLabel = '';
      if (unit) {
        yUnitLabel = '<text class="trendLabel" x="' + (pad.left - 30) + '" y="' + (pad.top - 6) + '" text-anchor="start" style="font-size:9px;opacity:0.6">成绩（' + unit + '）</text>';
      }
      /* PB参考线 */
      var pbLine = '';
      if (opts.pbValue != null && opts.pbValue > 0 && opts.pbValue >= minV && opts.pbValue <= maxV) {
        var pby = yPos(opts.pbValue);
        pbLine = '<line x1="' + pad.left + '" y1="' + pby.toFixed(1) + '" x2="' + (w - pad.right) + '" y2="' + pby.toFixed(1) + '" stroke="#10B981" stroke-width="1" stroke-dasharray="4,3" opacity="0.7"/>' +
          '<text x="' + (w - pad.right - 4) + '" y="' + (pby - 4).toFixed(1) + '" text-anchor="end" fill="#10B981" style="font-size:9px;font-weight:600">PB ' + opts.pbValue.toFixed(2) + (unit || '') + '</text>';
      }
      /* X轴标签 */
      var xLabels = '';
      var step = Math.max(1, Math.floor(dataPoints.length / 6));
      for (var xi = 0; xi < dataPoints.length; xi += step) {
        xLabels += '<text class="trendLabel" x="' + xPos(xi).toFixed(1) + '" y="' + (h - 8) + '" text-anchor="middle">' + (dataPoints[xi].label || '') + '</text>';
      }
      /* X轴标题 */
      var xTitle = '<text class="trendLabel" x="' + (pad.left + cw/2) + '" y="' + (h - 1) + '" text-anchor="middle" style="font-size:9px;opacity:0.5">日期</text>';
      /* 折线 */
      var pathD = '';
      for (var p = 0; p < dataPoints.length; p++) {
        pathD += (p === 0 ? 'M' : 'L') + xPos(p).toFixed(1) + ',' + yPos(dataPoints[p].value).toFixed(1) + ' ';
      }
      /* 面积 */
      var areaD = pathD + 'L' + xPos(dataPoints.length - 1).toFixed(1) + ',' + (pad.top + ch) + ' L' + xPos(0).toFixed(1) + ',' + (pad.top + ch) + ' Z';
      /* 数据点 + Tooltip */
      var dots = '';
      for (var d = 0; d < dataPoints.length; d++) {
        var isPB = opts.pbIdx != null && d === opts.pbIdx;
        var tip = opts.tooltips && opts.tooltips[d] ? opts.tooltips[d] : (dataPoints[d].label + ': ' + dataPoints[d].value + (unit || ''));
        dots += '<g class="trendPointGroup">' +
          '<circle class="trendPoint' + (isPB ? ' pbPoint' : '') + '" cx="' + xPos(d).toFixed(1) + '" cy="' + yPos(dataPoints[d].value).toFixed(1) + '" r="' + (isPB ? 5 : 3.5) + '">' +
          '<title>' + tip.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</title></circle>' +
          (isPB ? '<text x="' + xPos(d).toFixed(1) + '" y="' + (yPos(dataPoints[d].value) - 8).toFixed(1) + '" text-anchor="middle" fill="#10B981" style="font-size:9px;font-weight:700">⭐PB</text>' : '') +
          '</g>';
      }
      return '<svg class="trendChart" viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">' +
        grid + yUnitLabel + pbLine + xLabels + xTitle +
        '<path class="trendArea" d="' + areaD + '" fill="' + (color || '#3B82F6') + '" fill-opacity="0.08" stroke="none"/>' +
        '<path class="trendLine" d="' + pathD + '" stroke="' + (color || '#3B82F6') + '"/>' +
        dots + '</svg>';
    }

    /* 从wellness数据生成趋势点 */
    function wellnessTrendPoints(aid, field, days) {
      var list = wellnessOf(aid).slice().sort(function(x,y){return x.date < y.date ? -1 : 1;});
      var cutoff = new Date(new Date(todayStr() + 'T00:00:00').getTime() - (days - 1) * 86400000);
      var pts = [];
      for (var i = 0; i < list.length; i++) {
        if (new Date(list[i].date + 'T00:00:00') >= cutoff) {
          var v = field === 'readiness' ? readinessIndex(list[i]) : num(list[i][field]);
          if (v > 0) pts.push({ value:v, label:list[i].date.slice(5) });
        }
      }
      return pts;
    }

    /* 从成绩数据生成趋势点 */
    function resultsTrendPoints(aid, item, days) {
      var recs = getValidResults(aid, item).slice().sort(function(x,y){return x.date < y.date ? -1 : 1;});
      var cutoff = days ? new Date(new Date(todayStr() + 'T00:00:00').getTime() - (days - 1) * 86400000) : null;
      var pts = [];
      for (var i = 0; i < recs.length; i++) {
        if (cutoff && new Date(recs[i].date + 'T00:00:00') < cutoff) continue;
        var v = num(recs[i].time);
        if (v > 0) pts.push({ value:v, label:recs[i].date.slice(5) });
      }
      return pts;
    }

    /* ================= 渲染：Dashboard 概览 ================= */
    function planStats(store) {
      var total = 0, done = 0;
      for (var id in store) {
        var p = store[id];
        for (var w = 0; w < p.rows.length; w++) for (var d = 0; d < p.rows[w].length; d++) {
          var cell = p.rows[w][d];
          if (!cell || !String(cell.t || '').trim()) continue;
          total++;
          if (cell.done) done++;
        }
      }
      return { total:total, done:done, pct:total ? Math.round(done/total*100) : 0 };
    }

    /* ================= 渲染：成绩 ================= */
    function renderResults() {
      var v = document.getElementById('view');
      ensureSel();
      if (!S.sel) {
        v.innerHTML = '<div class="card"><div class="empty"><div class="emptyIcon">' + ico('trophy') + '</div><div class="emptyTitle">请先在"运动员"页添加运动员</div><div class="emptyDesc">添加运动员后再记录训练成绩</div><button class="btn btnPrimary btnSm mt8" data-act="addAthlete">添加运动员</button></div></div>';
        return;
      }
      var a = getAthlete(S.sel);
      var recs = DB.results[a.id] || [];
      var cycleStart = DB.cycleStart[a.id] || '';
      var baseItems = (a.items && a.items.length) ? a.items : DB.items;
      var items = [];
      for (var bi = 0; bi < STRENGTH_ITEMS.length; bi++) if (items.indexOf(STRENGTH_ITEMS[bi]) < 0) items.push(STRENGTH_ITEMS[bi]);
      for (var bi2 = 0; bi2 < baseItems.length; bi2++) if (items.indexOf(baseItems[bi2]) < 0) items.push(baseItems[bi2]);
      for (var bi3 = 0; bi3 < recs.length; bi3++) if (items.indexOf(recs[bi3].item) < 0) items.push(recs[bi3].item);
      if (!S.recItem || items.indexOf(S.recItem) < 0) S.recItem = items.length ? items[0] : (DB.items[0] || '');
      var recEffectiveItem = (S.recCustom || '').trim() || S.recItem;
      var recConfig = getEventConfig(recEffectiveItem);
      var recDirection = recConfig.direction;
      var recUnit = recConfig.unit;

      var itemChips = '';
      for (var i = 0; i < items.length; i++) {
        itemChips += '<button class="chip' + (items[i] === S.recItem ? ' on' : '') + '" data-act="recItem" data-item="' + esc(items[i]) + '">' + esc(items[i]) + '</button>';
      }

      var groups = {}, order = [];
      for (var r = 0; r < recs.length; r++) {
        var rc = recs[r];
        if (!groups[rc.item]) { groups[rc.item] = []; order.push(rc.item); }
        groups[rc.item].push(rc);
      }
      var itemOrder = [];
      for (var k = 0; k < items.length; k++) if (groups[items[k]] && itemOrder.indexOf(items[k]) < 0) itemOrder.push(items[k]);
      for (var o = 0; o < order.length; o++) if (itemOrder.indexOf(order[o]) < 0) itemOrder.push(order[o]);

      var cards = '';
      for (var g = 0; g < itemOrder.length; g++) {
        var it = itemOrder[g];
        if (S.recFilter !== 'all' && it !== S.recFilter) continue;
        var list = groups[it].slice().sort(function (x, y) { return x.date === y.date ? 0 : (x.date < y.date ? 1 : -1); });
        var direction = getEventDirection(it);
        var knownDirection = direction !== 'unknown';
        var higherBetter = direction === 'higher';
        var unit = unitOf(it);
        var cleanList = cleanRecs(list);
        var hist = knownDirection ? bestOf(cleanList, higherBetter) : null;
        var cyc = knownDirection && cycleStart ? bestOf(cleanRecs(list.filter(function (x) { return x.date >= cycleStart; })), higherBetter) : null;
        var arr = list.slice(0, 5);
        var trendTag = '';
        if (!knownDirection) {
          trendTag = '<span class="badge muted plainDot">方向未定义</span>';
        } else if (arr.length >= 2) {
          var f0 = num(arr[0].time), l0 = num(arr[arr.length-1].time);
          var diff = f0 - l0;
          if (Math.abs(diff) < 0.005) trendTag = '<span class="badge muted plainDot">近期平稳 →</span>';
          else if (higherBetter ? (diff > 0) : (diff < 0)) trendTag = '<span class="badge good plainDot">近期进步 ↑</span>';
          else trendTag = '<span class="badge danger plainDot">近期退步 ↓</span>';
        }
        var tr = knownDirection ? trendInfo(list, higherBetter) : null;
        var platTag = knownDirection && plateau(list, higherBetter) ? '<span class="badge warning plainDot">可能存在平台期</span>' : '';
        var anom = knownDirection ? anomalySet(list, higherBetter) : { flags:{}, status:'INSUFFICIENT_DATA' };

        var rows = '';
        for (var n = 0; n < list.length; n++) {
          var rc2 = list[n];
          var t = num(rc2.time);
          var isHist = hist !== null && t > 0 && Math.abs(t - hist) < 1e-9;
          var isCyc = !isHist && cyc !== null && t > 0 && Math.abs(t - cyc) < 1e-9;
          var env = envLabel(rc2);
          var w = recWind(rc2);
          var overWind = w !== null && w > 2.0;
          var mark = isHist ? '<span class="badge good plainDot">⭐ PB</span>'
            : isCyc ? '<span class="badge normal plainDot">周期最佳</span>' : '';
          if (overWind) mark += ' <span class="badge warning plainDot">超风速</span>';
          if (anom.flags[rc2.id]) mark += anom.flags[rc2.id] === 'DECLINE' ? ' <span class="badge warning plainDot">成绩下降信号</span>' : ' <span class="badge good plainDot">成绩改善信号</span>';
          /* 与PB差值 */
          var pbDiffVal = (hist !== null && t > 0) ? (t - hist) : null;
          var pbDiffHtml = pbDiffVal !== null ? '<span style="color:' + performanceDeltaColor(pbDiffVal, higherBetter) + ';font-weight:600">' + (pbDiffVal > 0 ? '+' : '') + pbDiffVal.toFixed(2) + '</span>' : '—';
          /* 与上一条对比趋势 */
          var trendHtml = '—';
          if (n < list.length - 1 && t > 0) {
            var prevT = num(list[n+1].time);
            if (prevT > 0) {

          }

          for (var fj = 0; fj < frs.length; fj++) if (frs[fj].date > latest) latest = frs[fj].date;
        }
        return latest;
      }
      function bestFor(aid, item) {
        if (S.cmpMode === 'day') {
          var dayList = cleanRecs((DB.results[aid] || []).filter(function (x) { return x.item === item && x.date === S.cmpDate; }));
          return bestOf(dayList, isHigherBetter(item));

        if (S.cmpMode === 'cycle') {

          list = cs ? cleanRecs(list.filter(function (x) { return x.date >= cs; })) : [];
        }
        return bestOf(list, isHigherBetter(item));

        for (var j4 = 0; j4 < vals.length; j4++) s4 += vals[j4];

    /* ================= 渲染：训练计划（月/周期） ================= */
    function renderPlanTable(kind) {
      var v = document.getElementById('view');

        return;
      }
      var a = getAthlete(S.sel);
      var plan = ensurePlan(kind, S.sel);
      var isMonth = kind === 'month';

      var done = 0, total = 0;
      for (var w = 0; w < plan.rows.length; w++) for (var d = 0; d < 7; d++) {
        var planCell = plan.rows[w][d];
        if (!planCell || !String(planCell.t || '').trim()) continue;
        total++;
        if (planCell.done) done++;
      }
      var pct = total ? Math.round(done/total*100) : 0;

      var daysTh = '';
      for (var i = 0; i < 7; i++) daysTh += '<th>' + DAYS[i] + '</th>';

      var rowsHtml = '';
      for (var w2 = 0; w2 < plan.rows.length; w2++) {
        var cells = '';

          var c = plan.rows[w2][d2] || emptyCell();
          var isRest = c.t && (c.t.indexOf('休息') >= 0 || c.t.indexOf('调整') >= 0);
          var body = c.t ? '<span class="cellText">' + esc(c.t) + '</span>' : '<span class="ph">点击填写</span>';
          cells += '<td><button class="cell' + (c.done ? ' done' : '') + (isRest && !c.done ? ' rest' : '') + '" data-act="editCell" data-kind="' + kind + '" data-w="' + w2 + '" data-d="' + d2 + '">' +
            (c.done ? '<span class="doneMark">✓</span>' : '') + body + '</button></td>';
        }
        var copyBtn = '<button class="rowIconBtn" data-act="copyWeek" data-kind="' + kind + '" data-w="' + w2 + '" title="复制第' + (w2+1) + '周到另一周">' + ico('copy') + '</button>';
        var phaseCell = isMonth
          ? '<td class="weekLbl">第' + (w2+1) + '周 ' + copyBtn + '</td>'

        rowsHtml += '<tr>' + phaseCell + cells + '</tr>';
      }

            '<button class="btn btnGhost btnSm" data-act="' + (isMonth ? 'clearMonth' : 'clearCycle') + '">' + ico('trash') + ' 清空计划</button>' +
